# Studio's installer stages on a hosted Windows runner, the throwaway machine the desk's rule keeps installers off
# (ported from the engine's installer-runner.yml).
#
# Dispatch only: a push, a pull request or a fork cannot start it. The job checks out the commit asked for; the runner's
# own scripts (tools/runner/) always come from the workflow's commit and are written under RUNNER_TEMP, so a build never
# judges itself with a runner it changed.
#
# Four stages, asked one at a time:
#   probe     what the runner is: its account, groups and integrity, UAC, whether a standard account and a SYSTEM task can
#             be started, a junction, csc. Installs nothing.
#   marker    an all-users install must never run, with administrator rights, the file the installing account's HKCU
#             uninstall entry names (tools/runner/hkcu-uninstaller-marker.mjs).
#   per-user  the tree's own tests/update-install.mjs --update: an older install for one account, the newer over it, the
#             uninstall. old_sha builds the older installer; windows_date opens the window wall for its launches.
#   legs      the six installer legs (tools/runner/installer-legs.mjs): all-upgrade, running-1618, system-bare, locked-1618,
#             all-move, all-space-d. old_sha builds the older installer for all-upgrade, locked-1618 and all-move;
#             windows_date opens the window wall for running-1618.
#
# Nothing secret is handed to the runner: contents: read, no credential kept in the checkout, no catalog, no name list.
# The repository is private, so its logs are too; they are still scanned against the name list before anything from them
# is quoted.
name: installer-runner

run-name: installer-runner ${{ inputs.stage }} at ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to check out and test
        required: true
        type: string
      stage:
        description: probe, per-user, marker or legs
        required: true
        type: string
        default: probe
      legs:
        description: For the legs stage, leg names separated by spaces (see tools/runner/installer-legs.mjs); empty runs every leg but the installer mends' seven, which run only where named
        required: false
        type: string
        default: ""
      old_sha:
        description: The older commit whose installer is installed first (for per-user and upgrade/move/locked legs)
        required: false
        type: string
        default: ""
      windows_date:
        description: The runner's date (UTC), for launches in per-user and running-1618. Empty refuses them, as on the desk.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: the stage asked
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          case "$STAGE" in
            probe|per-user|marker|legs) ;;
            *) echo "stage is '$STAGE', want probe, per-user, marker or legs" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: the runner's files, always the workflow's own
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runner/tools/runner"
          # The checkout fetched the whole history (fetch-depth: 0), so the workflow's own commit is here already; this repository is
          # private and the checkout keeps no credential, so a fetch from origin is refused (runs 43332627163 and 43332631487).
          git cat-file -e "$GITHUB_SHA^{commit}" || { echo "the workflow's commit $GITHUB_SHA is not in the checkout"; exit 1; }
          for f in installer-probe.ps1 hkcu-uninstaller-marker.mjs installer-legs.mjs; do
            git show "$GITHUB_SHA:tools/runner/$f" > "$RUNNER_TEMP/runner/tools/runner/$f" || echo "no tools/runner/$f at the workflow's commit"
          done

      - name: probe
        if: inputs.stage == 'probe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\out" | Out-Null
          & "$env:RUNNER_TEMP\runner\tools\runner\installer-probe.ps1" -Out "$env:RUNNER_TEMP\out\probe.txt"

      - uses: actions/setup-node@v4
        if: inputs.stage != 'probe'
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        if: inputs.stage != 'probe'
        shell: bash
        run: npm ci

      - name: the pin, from the public engine remote
        if: inputs.stage != 'probe'
        shell: bash
        run: |
          node tools/engine-fetch.mjs 2>&1 | tee "$RUNNER_TEMP/engine-fetch.log"
          grep -q 'from the bare mirror of' "$RUNNER_TEMP/engine-fetch.log" || { echo 'the pin was not read from the remote'; exit 1; }

      - name: the older installer, built from old_sha
        if: (inputs.stage == 'legs' || inputs.stage == 'per-user') && inputs.old_sha != ''
        shell: bash
        env:
          OLD_SHA: ${{ inputs.old_sha }}
        run: |
          git worktree add "$RUNNER_TEMP/old" "$OLD_SHA"
          cd "$RUNNER_TEMP/old"
          npm ci
          node tools/engine-fetch.mjs
          ETIUDA_STUDIO_DIST="$RUNNER_TEMP/old-dist" node tools/package.mjs --test-identity
          f="$(ls "$RUNNER_TEMP/old-dist"/*-setup.exe 2>/dev/null | head -1)"
          [ -n "$f" ] || { echo "no older installer was built"; exit 1; }
          echo "ETIUDA_STUDIO_OLD_SETUP_EXE=$f" >> "$GITHUB_ENV"

      # The scripts run from the checkout's tools/runner, so they require the tree under test; the copies under RUNNER_TEMP are
      # placed over them first, so the instrument is the workflow's own whatever the tested commit holds.
      - name: the workflow's instrument over the checkout
        if: inputs.stage != 'probe'
        shell: bash
        run: |
          mkdir -p tools/runner
          cp "$RUNNER_TEMP/runner/tools/runner/"*.mjs tools/runner/ 2>/dev/null || true

      - name: marker
        if: inputs.stage == 'marker'
        shell: bash
        run: node tools/runner/hkcu-uninstaller-marker.mjs --out "$RUNNER_TEMP/out"

      - name: per-user
        if: inputs.stage == 'per-user'
        shell: bash
        env:
          ETIUDA_WINDOWS: ${{ inputs.windows_date }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node tests/update-install.mjs --update 2>&1 | tee "$RUNNER_TEMP/out/per-user.txt"
          exit "${PIPESTATUS[0]}"

      - name: legs
        if: inputs.stage == 'legs'
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
          ETIUDA_WINDOWS: ${{ inputs.windows_date }}
        run: node tools/runner/installer-legs.mjs --out "$RUNNER_TEMP/out" $LEGS

      # NOTHING BUILT IS PUBLISHED. The repository is public, so its artifact is public: the folder uploaded holds logs and
      # results only. A program, a package or anything over 5 MB found in it is moved out before the upload and the job is red, so
      # no later change can start publishing a build, which is a release, by accident.
      - name: nothing built is uploaded
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/out"; held="$RUNNER_TEMP/held-back-from-upload"
          [ -d "$out" ] || exit 0
          found=$(find "$out" -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.msix' -o -iname '*.appx' -o -iname '*.nupkg' -o -iname '*.zip' -o -iname '*.7z' -o -iname '*.asar' -o -iname '*.dll' -o -size +5M \))
          [ -z "$found" ] && exit 0
          mkdir -p "$held"
          printf '%s\n' "$found" | while IFS= read -r f; do echo "FAIL not uploaded, a build or a file over 5 MB: ${f#$out/}"; mv "$f" "$held/"; done
          exit 1

      - name: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-runner-${{ inputs.stage }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7
