.st-head .spacer{flex:1 1 auto}
.st-where{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:6px 0 14px}
/* A FOLDER IN RUNNING TEXT (board 976, item 11): the glyph and the last two steps. The whole
   path is the chip's title. The window's foot is .sb-dir and is not this. The cobalt dot stays
   on a relay place; it is left out only where the chip replaces a real folder. */
.path-chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:7px;background:color-mix(in srgb,var(--ink) 6%,transparent);
  font:12.5px var(--sans);color:var(--ink);white-space:nowrap;vertical-align:baseline}
.path-chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linejoin:round;color:var(--dim)}
/* THE COUNTING PERIOD (board 559). The band sits under the head. Presets take Settings' tint.
   Handle and fill positions are percentages, set from the page. */
.sp{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px 10px;margin:12px 0 0;
  box-shadow:0 1px 2px rgba(15,23,42,.04)}
:root[data-theme=dark] .sp{background:var(--panel-raised)}
.sp-top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-width:0}
.sp-lbl{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);flex:0 0 auto}
.sp-presets{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.sp-presets button{height:28px;padding:0 11px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--dim);
  font:13px var(--sans);white-space:nowrap}
.sp-presets button:hover{background:var(--quiet);color:var(--ink)}
.sp-presets button.on{background:var(--sx-sel-bg);box-shadow:inset 0 0 0 1px var(--sx-sel-ring);color:var(--ink);font-weight:600}
.sp-presets button:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.sp-presets button:disabled{color:var(--dim);opacity:.45;cursor:default;background:transparent}
.sp-top .spacer{flex:1 1 auto}
.sp-read{font-size:13.5px;color:var(--dim);white-space:nowrap}
.sp-track{position:relative;height:46px;margin:6px 9px 0;touch-action:none;user-select:none}
.sp-rail{position:absolute;left:0;right:0;top:13px;height:6px;border-radius:3px;background:var(--quiet);
  box-shadow:inset 0 0 0 1px var(--line)}
.sp-tick{position:absolute;top:13px;width:1px;height:6px;background:var(--line-strong);opacity:.7}
.sp-tick.m{top:9px;height:14px;opacity:1}
.sp-mlbl{position:absolute;top:27px;transform:translateX(-50%);font-size:11.5px;color:var(--dim);white-space:nowrap}
.sp-mlbl.first{transform:none}
.sp-fill{position:absolute;top:12px;height:8px;border-radius:4px;background:var(--mark)}
.sp-h{position:absolute;top:6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--mark),0 1px 3px rgba(15,23,42,.25)}
:root[data-theme=dark] .sp-h{background:#fff}
.sp-h:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.sp-flag{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:6px;background:var(--ink);
  color:var(--panel);font:600 12px var(--sans);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.sp-h.held .sp-flag,.sp-h:focus-visible .sp-flag{opacity:1}
.sp-note{display:flex;align-items:flex-start;gap:7px;margin:4px 0 2px;font-size:12.5px;color:var(--dim)}
.sp-note svg{width:15px;height:15px;flex:0 0 auto;color:#b45309}
:root[data-theme=dark] .sp-note svg{color:#f59e0b}
/* The fill travels as the pill, clipped by the track's own corners, so the focus ring is drawn inside the part. */
.seg.st-views{position:relative;overflow:hidden}
.seg.st-views span:focus-visible{outline-offset:-3px}
.seg.st-views span{position:relative;z-index:1}
.seg.st-views span.on.pilled{background:transparent;box-shadow:none}
.st-pill{position:absolute;z-index:0;top:0;bottom:0;border-radius:0;background:var(--mark-fill);
  transform-origin:0 50%;pointer-events:none}
/* In words: a ruled list, the sentence at the left in the display face, its figure at the right, so it uses the width. */
.st-month{overflow:hidden}
.sm-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);align-items:center;gap:8px 32px;
  padding:16px 20px;border-top:1px solid var(--line);min-height:76px}
.sm-row:first-child{border-top:0}
.sm-s{font:350 20px/1.45 var(--sans-display);color:var(--ink);margin:0;min-width:0;text-wrap:pretty}
.sm-n{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* a card named in a sentence is a door to it: the marker's ink as a rule under the words, clear of the ogonek */
.sm-card{color:inherit;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:2px;
  text-underline-offset:4px;border-radius:3px;cursor:default}
.sm-card:hover,.sm-card:focus-visible{background:color-mix(in srgb,var(--mark) 10%,transparent);outline:none}
.sm-acts{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:10px;vertical-align:3px}
.sm-f{min-width:0;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px}
.sm-foot{padding:12px 20px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;background:var(--chrome)}
.sm-foot .lnk{border:0;background:transparent;padding:0;font:inherit;color:var(--ink);text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line-strong)}
/* the places held while the share is read: two quiet lines a row, never a spinner */
.sm-hold{display:grid;gap:9px;grid-column:1/-1}
.sm-hold i{display:block;height:11px;border-radius:6px;background:var(--quiet)}
.sm-hold i:first-child{width:62%}
.sm-hold i:last-child{width:38%}
.sm-desks{display:inline-flex;flex-wrap:wrap;gap:5px;flex:0 1 auto}
.sm-desks i{width:12px;height:12px;border-radius:50%;background:var(--engine);display:block}
.sm-desks i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--engine)}
.sm-cards{display:grid;grid-template-columns:repeat(13,10px);gap:4px;flex:0 0 auto}
.sm-cards i{width:10px;height:10px;border-radius:2px;box-shadow:inset 0 0 0 1.25px var(--line-strong);display:block}
.sm-more{font-size:12px}
.sm-bar{position:relative;flex:1 1 auto;min-width:80px;height:10px;border-radius:5px;background:var(--quiet);overflow:hidden}
.sm-bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--mark);transform-origin:0 50%}
.sm-pct{font-size:12.5px}
.sm-bars{display:grid;gap:5px;flex:1 1 auto;min-width:0}
.sm-bars .r{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;align-items:center;gap:8px}
.sm-bars .tt{white-space:nowrap;overflow:hidden;color:var(--ink);font-size:12.5px}
.sm-bars .b{height:6px;border-radius:3px;background:var(--mark);transform-origin:0 50%}
.sm-bars .v{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
/* a two-card path in the map's own shapes: two cards and the team's dotted arrow, drawn solid once it is a link */
.sm-twin{display:flex;align-items:center;min-width:0;flex:1 1 auto}
.sm-twin .nd{flex:1 1 0;min-width:0;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);
  padding:6px 9px;font-size:12.5px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden}
.sm-twin svg{flex:0 0 64px;height:26px;overflow:visible;background:radial-gradient(circle at 4px 50%,var(--mark) 0 4.5px,transparent 5px)}
.sm-twin .dots{fill:none;stroke:var(--dim);stroke-width:2.5;stroke-dasharray:1 6;stroke-linecap:round}
.sm-twin .solid{fill:none;stroke:var(--mark);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.sm-twin .solid.lit{stroke-dashoffset:0}
.sm-twin .hd{fill:var(--dim)}
.sm-twin .hd.lit{fill:var(--mark)}
.sm-twin text{font:11.5px var(--sans);fill:var(--dim);text-anchor:middle}
/* In figures: the five figures and the catalog's one bar, then three panes of bars, each with its act at its foot. */
.fg-top{padding:14px 18px 16px}
.fg-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 24px}
.fg-tile{display:grid;gap:2px;min-width:0}
.fg-tile .v{font:350 32px/1.1 var(--sans-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.fg-tile .v small{font:350 18px var(--sans-display);color:var(--dim);margin-left:6px}
.fg-tile .k{font:600 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.fg-cover{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 18px;margin-top:16px}
.fg-bar{position:relative;height:12px;border-radius:6px;background:var(--quiet);overflow:hidden;min-width:80px}
.fg-bar i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.fg-bar i.used{background:var(--mark);transform-origin:0 50%}
.fg-bar i.nobody,.fg-legend i.nobody{background:repeating-linear-gradient(135deg,var(--line-strong) 0 2px,transparent 2px 5px)}
.fg-ed{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px}
.fg-legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--dim);font-size:12.5px;grid-column:1/-1}
.fg-legend span{display:inline-flex;align-items:center;gap:6px}
.fg-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fg-legend i.used{background:var(--mark)}
.fg-legend i.nobody{box-shadow:inset 0 0 0 1px var(--line-strong)}
.fg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:1279px){ .fg-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.fg-h{display:flex;align-items:center;gap:8px}
.fg-h .spacer{flex:1 1 auto}
.fg-rule{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px;line-height:1.5}
.fg-list{list-style:none;margin:0;padding:6px 0}
.fg-list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,22%) 48px;align-items:center;gap:10px;
  padding:6px 14px;min-height:34px}
.fg-list .tt{white-space:nowrap;overflow:hidden;font-size:13.5px}
.fg-list .b{height:8px;border-radius:4px;background:var(--mark);transform-origin:0 50%}
.fg-list .v{font:12.5px var(--mono);color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.fg-list.rot li{grid-template-columns:minmax(0,1fr) auto}
.fg-list.paths li{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:9px 14px;border-top:1px solid var(--line);overflow:hidden}
.fg-list.paths li:first-child{border-top:0}
.fg-path .pr{display:grid;gap:1px;min-width:0}
.fg-path .to{display:flex;align-items:center;gap:6px;min-width:0;color:var(--dim);font-size:13px}
.fg-path .to .ic{width:14px;height:14px}
.fg-path .side{display:flex;align-items:center;gap:8px}
.fg-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg-list.paths li.fg-note,.fg-note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;
  background:color-mix(in srgb,var(--mark) 7%,var(--panel))}
.fg-note>.ic{color:var(--mark)}
.fg-note .sp{flex:1 1 auto;min-width:0}
@media (max-width:1099px){
  .fg-tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 14px}
  .fg-tile .v{font-size:26px}
  .fg-tile .v small{font-size:15px}
  .sm-s{font-size:18px}
  .sm-row{grid-template-columns:minmax(0,1fr) minmax(180px,36%);gap:8px 20px;padding:14px 16px}
}

/* THE DECLARED LANGUAGES, board 579. A LIST OF ROWS AND NOT A TABLE, which is the one structural
   decision here: two of the three things a row can carry - the sentence about a language this
   build cannot read, and the block a removal opens - span the row's whole width and belong to
   the row above them. A table cell that spanned every column would be a second <tr> pretending
   to belong to the first, and the intents table next door shows what that costs. Every rule
   below is a .pane's own padding, the canvas's line and one of her type sizes; nothing here
   invents a colour, a radius or a weight.

   AND NOTHING HERE IS RED. The cards table's awaiting row is a dashed edge and the lint's two
   severities are told apart by weight and ground, because the canvas has no hue for severity
   anywhere; a first one is a decision for Maxim's eye. So the hard sentence is full-weight ink
   against the dim notes around it, and the removal's block is .dashed, hers. */
.ls>div{border-top:1px solid var(--line);padding:9px 14px}
.ls>div:first-child{border-top:0}
.ls.plain>div{border-top:0;padding:4px 0}
.ls .lsk{width:26px;flex:0 0 auto;font-weight:600;color:var(--ink)}
.ls .lsm{font-size:14px}
.ls .lsn{font:12.5px var(--sans);color:var(--dim);white-space:nowrap}
.ls .lss{font-size:12.5px;color:var(--dim);margin:5px 0 0;max-width:66ch}
.ls .lss.hard{color:var(--ink);font-weight:600}
.ls .lsf{width:96px;flex:0 0 auto}
.ls .lsgo{margin:8px 0 2px;padding:10px 12px}
.ls .lsgo p{margin:0 0 6px;font-size:12.5px;color:var(--dim)}
.ls .lsgo p.lsh{font-size:13.5px;color:var(--ink);font-weight:600}
.ls .lsgo p.lsc{gap:18px;color:var(--ink)}
/* A LANGUAGE'S ROW WRAPS ITS CONTROLS RATHER THAN RUNNING PAST ITS PANE: the primary's row
   carries a chip more than the others and put Remove 37px outside the pane at 1280. */
.ls>div>.row2:first-child{flex-wrap:wrap;row-gap:6px;justify-content:flex-end}
/* THE MAPPING'S SELECTS ARE AS WIDE AS THEIR WORDS. At width:100% of a cell the first-row text
   squeezed, each read "Titl" and "Do", and the Polish "Nie importuj" read "Nie". */
table.map select.field{width:auto}
table.map td.miss{overflow-wrap:anywhere}
/* WHY NEXT IS HELD, said beside it in the foot in the canvas's dim note. */
.foot .why{font-size:12.5px;color:var(--dim)}
/* The held Next wears the engine's own disabled weight (.tab-add:disabled, .field-clear). */
.foot .btn[disabled]{opacity:.35}
/* A REFUSED ANSWER'S LIST OF KEYS AND THE STATISTICS FOLDER'S PATH BREAK where they must,
   because neither has a space to break at and each pushed #main sideways. */
#main .dashed.refused{overflow-wrap:anywhere}
#main .lede.where .desk{white-space:normal}
#main .lede.where .desk .mono{white-space:normal;overflow-wrap:anywhere;min-width:0}

/* THE CHROME ROW SURVIVES WHAT THE SETTINGS SCREEN NOW PERMITS (board 579). The row grew one
   button per declared language and the declared set is now open, so the two rules below are
   what stops it clipping. MEASURED FIRST, on Claudia's stub at Studio's own 900px minimum: the
   segment is 127px at two languages and 645 at sixteen, about 36px each, and the only elastic
   element in the row is the search box, which paid the whole cost - 426px at two, 210 at eight,
   51 at twelve - floored at 22px and then let the row overflow by 100px in English and 106 in
   Polish at sixteen. So the field gets a floor it can still be typed in, and the segment wraps
   rather than pushing. NEITHER RULE MOVES A PIXEL BELOW THIRTEEN LANGUAGES, which is what makes
   this a repair and not a redesign: the wrap only ever happens where the row was clipping. */
.chrome>input.field.grow{flex-basis:180px;min-width:180px}
.chrome .seg.langs{flex:0 1 auto;flex-wrap:wrap;row-gap:2px}

/* THE BASIS ABOVE IS THE WHOLE OF WHY THE SEGMENT DOES NOT WRAP AT THREE LANGUAGES, and it cost
   a shot to find. The canvas gives .field.grow `flex:1 1 auto` and input.field `width:100%`, so
   the search box's hypothetical main size is the WHOLE row; the row is therefore always in
   negative free space and everything in it that may shrink does, however wide the window is.
   While the segment could not shrink that was invisible - the field alone paid - and the moment
   it could, a three-language segment wrapped into a square on a 1624px window. A basis of 180px
   makes the hypothetical sum honest, so free space is positive until the row is genuinely full
   and the segment keeps its content width until then. */

/* THE PATHS ON THE SETTINGS SCREEN WRAP RATHER THAN RUN OFF THE PANE. .mono is nowrap, which is
   right of a date and of an edition and wrong of a folder: a cut path is a lie, and this is the
   one screen whose whole business is telling a person where their catalog is. */
.lsw .mono{white-space:normal;overflow-wrap:anywhere}

/* THE DISCS IN THE CORNER (board 616, Maxim ruling the four open questions on 2026-09-20
   at 21:10 and 21:50 against Claudia's eighteen frames). THE GEOMETRY IS HERS, measured on her
   own frames rather than chosen here: 44px discs, 22px from the right and from the foot, 54px
   apart, which clears the platform's 15px scrollbar lane by 7px and covers 98px of the table's
   right end. THE IDIOM IS THE ENGINE'S `.fab` AND `.fab-clear`, lifted rather than redrawn - a
   dashed ring in the strong line, the dim ink, a 16px glyph, and nothing under it standing
   still, because the engine's resting shadow is transparent and A6's weighted corner was not
   the frame he chose.

   Z-INDEX 4 IS THE ENGINE'S 48 SAID IN THIS BUILD'S NUMBERS: over the work (2) and under the
   scrim (5), so a cover dims the corner and takes its presses like everything else.

   THE CLOSED RING IS `--mark` AND NOT `--band`. A3 is the ruling - while a card is open the
   dashed edge closes to a solid violet and the glyph goes with it - and the frame drew that in
   the band, which Claudia measured at 4.86:1 on the light pane and 1.99:1 on the dark one: the
   one state this ruling is about would be invisible in dark. `--mark` IS the band's own value
   in light, by arithmetic rather than by reference (see the token at the head of this sheet),
   and steps to #a78bfa at 6.76:1 in dark. So the light frame is what he chose to the byte and
   the dark one is the same decision made legible. */
.discs{position:fixed;right:22px;bottom:22px;z-index:4;display:flex;align-items:center;gap:10px}
.disc{width:44px;height:44px;padding:0;border:1px dashed var(--line-strong);border-radius:50%;
  background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center;
  transition:color .16s,background-color .16s,border-color .16s}
/* The hover is .btn's own and invents no colour; :focus-visible rides it, as every hover rule
   in this sheet does. */
.disc:hover,.disc:focus-visible{background:color-mix(in srgb,var(--ink) 6%,var(--panel));
  color:var(--ink)}
/* A3, THE FIRST DISC'S EFFECT: nothing moves, nothing is added, the edge simply closes. */
.disc.live{border-style:solid;border-color:var(--mark);color:var(--mark)}
/* C1, WHAT A DISC THAT COMES AND GOES DOES WHEN IT IS NOT NEEDED: the engine's own answer for `.fab-clear`,
   its rule and its curve unchanged. Faded rather than display-toggled, so that a proposal
   arriving arrives; invisible it takes no focus and no click, which ui/app.js says a second
   time in tabIndex and aria-hidden. */
.disc.q{opacity:0;transform:translateY(6px) scale(.9);visibility:hidden;pointer-events:none;
  transition:opacity .2s cubic-bezier(.2,.7,.3,1),transform .2s cubic-bezier(.2,.7,.3,1),
    visibility 0s .2s,color .16s,background-color .16s,border-color .16s}
.disc.q.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
/* B1, THE COUNT: the engine's `.fab-n` exactly. Above one waiting row the glyph gives way to the
   number in the interface face, and hover puts the glyph back, so a disc showing a number can
   always be asked what it is. */
.disc .dn{font:600 14px var(--sans);letter-spacing:.2px;display:none}
.disc.many .dn{display:block}
.disc.many .ic{display:none}
.disc.many:hover .dn,.disc.many:focus-visible .dn{display:none}
.disc.many:hover .ic,.disc.many:focus-visible .ic{display:block}
@media (prefers-reduced-motion:reduce){ .disc{transition:none} }
/* AND THE ROW OF CARD ACTS KEEPS OUT OF THE CORNER. Measured, not guessed: with a card picked
   the cards screen pins Duplicate and Delete card to the pad's right edge, the discs are
   fixed 22px from the window's, and `document.elementFromPoint` at the middle of Delete card
   answered a disc (window 1299x891, the row at 1163..1270 against the discs at 1125..1277,
   2026-09-21). The corner covering the right end of a TABLE ROW is what Maxim accepted from the
   frames; covering a button is a control nobody can press. 120 is the corner's two discs, 98px,
   plus its 22px inset, so the row now ends where the discs begin at any width. The scrolling sections
   need no such rule and were measured too: at seven of them nothing overlapped at all, and what
   a person scrolls under the corner they can scroll back out, which is the engine's own bargain
   with its `.fab`. */
.row2.acts{padding-right:120px}

/* ---- retired cards, a card's history and the undo bar (board 834, step 6, C07) ----
   Claudia's sheet of 2026-09-29, C07-1 to C07-3: no new colour, the retired mark is the awaiting chip's dashed edge. */
/* R2: the switch in the Card column's heading, in the heading's own size and not its capitals. */
.viewbar{display:inline-flex;vertical-align:middle;margin:-4px 0 -4px 12px;text-transform:none;letter-spacing:normal;
  font-weight:400}
.viewbar .seg span{padding:1px 8px;font-size:12.5px}
.chip.ret{background:transparent;border-style:dashed;font-weight:600;color:var(--dim)}
.pane>h3.t .chip.ret{margin-left:10px;vertical-align:2px}
#main tr.ret td{color:var(--dim)}
#main tr.ret td.t-title .chip.ret{margin-left:8px;font-style:normal}
.retbox{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.retbox>span{flex:1 1 auto;color:var(--ink)}
.retbox .btn{flex:0 0 auto}
.hist .hrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:7px 0 0}
.hist .hrow i{width:11px;height:11px;border-radius:999px;border:2px solid var(--line-strong);
  background:var(--panel);flex:0 0 auto;align-self:center}
.hist .hrow.now i{background:var(--solid);border-color:var(--solid)}
.hist .hrow .hnote{color:var(--ink);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.hist .hacts{display:flex;gap:8px;padding:4px 0 0 21px}
.hstrip{display:flex;align-items:center;gap:0;padding:14px}
.hstrip .hline{flex:1 1 20px;height:1px;background:var(--line-strong);min-width:12px}
.hstrip .hnode{display:grid;gap:2px;justify-items:center;padding:6px 14px;border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);background:var(--panel);flex:0 0 auto}
.hstrip .hnode.on{border:2px solid var(--solid);padding:5px 13px}
.hstrip .hnode b{font-size:13.5px}
.hist-h1 .nw{font-weight:700}
.undo{flex:0 0 auto;position:relative;z-index:2;background:var(--chrome);border-top:1px solid var(--line);
  padding:9px var(--app-pad);display:flex;align-items:center;gap:12px;font-size:13.5px}
/* The bar's words start where the page does, beside the rail at every width (tests/rail-left.mjs). */
.undo{padding-left:calc(232px + var(--app-pad))}
@media (min-width:1600px){ .undo{padding-left:calc(264px + var(--app-pad))} }
.undo .key{font:12px var(--mono);color:var(--dim);border:1px solid var(--line-strong);
  border-radius:var(--radius-xs);padding:1px 7px}

/* ---- bulk upkeep: ticks, find and replace, the sheet (board 834, step 10, C09) ----
   Claudia's sheet of 2026-09-29, C09-1, C09-5 and C09-6: the tick is the set's own .cbx, the strip is a plain row, the bar is the
   undo bar's twin, and the preview's strike and underline are the one place this canvas has a red and a green (the frame's). */
#main th.tk,#main td.tk{width:1%;padding-right:0;white-space:nowrap}
#main td.tk .cbx{display:block}
.fstrip{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px}
.fstrip .k{font:600 11.5px var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.fstrip input.field{width:200px;flex:0 0 auto}
.fstrip .n{font-size:13px;color:var(--dim)}
#main td.fp{white-space:normal;word-break:normal;font-size:13.5px}
#main td.fp .fl{display:block;padding:2px 0}
#main td.fp .chip{margin-right:8px}
#main td.fp del{text-decoration:line-through;color:#a02a1c;background:#fbe9e6;border-radius:3px;padding:0 2px}
#main td.fp ins{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;color:#1b6b3a;
  background:#e4f4ea;border-radius:3px;padding:0 2px;margin-left:2px}
:root[data-theme=dark] #main td.fp del{color:#f1a79d;background:#3a1f1c}
:root[data-theme=dark] #main td.fp ins{color:#8fd6a8;background:#16301f}
.bulk{gap:10px;padding-right:calc(var(--app-pad) + 120px)}   /* ends where the corner's discs begin, as .row2.acts does */
.bulk>b{font-size:13.5px;margin-right:4px}
.bulk select.btn{appearance:none;padding-right:10px}
.bulk .n{font-size:12.5px;color:var(--dim)}
.btn.icon{padding:0 9px}

/* ---- the commitment mark and the cards that follow (board 814, step 11, S3b) ----
   Claudia's sheet of 2026-10-04, frames S1, S3, S4 and S6: the tick is the set's .cbx, the list is rows on the field's
   ground, the mark is plain ink, and the suggestion is the engine's bubble laid in the pane rather than floated. */
.cn-tick{gap:8px;font-size:14px}
.cn-mark{display:inline-flex;vertical-align:-2px;margin-left:6px}
.kv .cn-bub{position:relative;margin:8px 0 4px;max-width:100%}
.kv .cn-bub>.bub-tip{left:2px}
.kv .cn-bub p{margin:0 0 9px;font-size:13.5px;color:var(--bub-ink)}
/* A secondary button cut into the fill, as the tour's are, for the tour's measured contrast. */
.kv .cn-bub .btn{background:rgba(0,0,0,.14);color:#fff;border-color:transparent;font-weight:600}
.kv .cn-bub .btn:hover,.kv .cn-bub .btn:focus-visible{background:rgba(0,0,0,.26);color:#fff;border-color:transparent}
#cardNext .cn-head{display:flex;align-items:center;gap:10px}
#cardNext .cn-head .k{flex:1 1 auto}
.cn-list{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:6px}
.cn-row{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 4px;border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);background:var(--field);user-select:none;touch-action:none}
.cn-row.shift{transition:transform var(--m-move) var(--m-ease)}
.cn-row.drag{position:relative;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cn-row .grip{color:var(--dim);display:grid;place-items:center;width:18px}
.cn-row .key{font:600 11.5px var(--mono);color:var(--dim);border:1px solid var(--line-strong);border-radius:5px;
  padding:0 5px;white-space:nowrap}
.cn-row .key.off{visibility:hidden}
.cn-row .tt,.cn-hit .tt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;font-size:14px}
.cn-row .cn-mark,.cn-hit .cn-mark{margin-left:0}
.cn-row .x{width:26px;height:26px;padding:0;display:grid;place-items:center;border:0;background:transparent;
  color:var(--dim);border-radius:6px}
.cn-row .x:hover,.cn-row .x:focus-visible{background:var(--line);color:var(--ink)}
.cn-end{padding:9px 10px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--dim);
  font-size:13.5px;margin:6px 0 4px}
.cn-foot{display:flex;gap:8px;align-items:center;margin-top:2px}
/* A path's end carries its Dismiss (S3e-2); the team's candidates sit under the list (S3c carve A). */
.cn-end:has(>.btn){display:flex;align-items:center;gap:8px}
.cn-end>span{flex:1 1 auto;min-width:0}
.cn-team{display:grid;gap:2px;margin:6px 0 4px}
.cn-pick{display:grid;gap:4px;margin-top:2px}
.cn-pick .row2 .field{flex:1 1 auto;min-width:0}
.cn-found{display:grid;gap:2px}
.cn-hit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border:0;
  border-radius:var(--radius-xs);background:transparent;color:var(--ink);font:inherit}
.cn-hit.on,.cn-hit:hover{background:var(--line)}
.cn-hit .n{font-size:12.5px;color:var(--dim);white-space:nowrap}
.ci-pick{display:grid;gap:4px;margin-top:6px}
.ci-found{display:grid;gap:2px;max-height:220px;overflow-y:auto;scrollbar-width:thin}
.ci-hit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border:0;
  border-radius:var(--radius-xs);background:transparent;color:var(--ink);font:inherit}
.ci-hit.on,.ci-hit:hover{background:var(--line)}
.ci-hit .tt{flex:1 1 auto;min-width:0;font-size:13.5px}
.ci-none{padding:8px 10px;color:var(--dim);font-size:13px}
/* THE PATHS MAP (board 814, S3c), Claudia's frames C3 and C4: the catalog's links in the marker's violet, the team's
   totals dotted in the dim ink, cards as the editor's panes on a dotted ground, the chosen thing's panel floating at the
   foot of the frame. Positions are the page's arithmetic (PM in ui/app.js), so nothing here sets a card's place. */
.pm-pad{display:flex;flex-direction:column;min-height:100%}
.pm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pm-head h1{flex:1 1 auto;margin:0;min-width:0}
.pm-keys{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--dim);align-items:center}
.pm-keys>span{display:inline-flex;align-items:center;gap:7px}
.pm-keys i{display:inline-block;width:24px;border-top:2.5px solid var(--mark)}
.pm-keys i.team{border-top:2.5px dotted var(--dim)}
.pm-frame{position:relative;flex:1 1 auto;min-height:420px;margin-top:10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--panel);overflow:hidden}
.pm-scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;
  background-image:radial-gradient(var(--line-strong) 1px,transparent 1.4px);background-size:18px 18px}
.pm-canvas{position:relative;margin:0 0 220px}
.pm-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.pm-svg .a{fill:none;stroke:var(--mark);stroke-linecap:round}
.pm-svg .a.team{stroke:var(--dim);stroke-dasharray:1 6}
.pm-svg .a.sel{filter:drop-shadow(0 0 3px var(--mark))}
.pm-svg .a.drag{stroke-width:2;stroke-dasharray:6 6}
.pm-svg .h{fill:var(--mark)}
.pm-svg .h.team{fill:var(--dim)}
.pm-svg .x{font:13px var(--sans);fill:var(--dim);text-anchor:end}
.pm-svg .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.pm-node{position:absolute;display:grid;align-content:center;gap:3px;padding:8px 30px 8px 13px;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);
  box-shadow:0 1px 2px rgba(15,23,42,.06)}
.pm-node.root{border:2px solid var(--mark)}
.pm-node.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--mark) 30%,transparent)}
.pm-node.ret{opacity:.6}
.pm-node .tt{font-size:14.5px;line-height:1.3;max-height:2.6em;overflow:hidden}
.pm-node .n{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.pm-node .n .cn-mark{margin-left:6px}
.pm-ends{position:absolute;right:9px;top:7px;color:var(--dim);display:grid}
.pm-dot{position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;padding:0;border-radius:50%;
  border:1.5px solid var(--dim);background:var(--panel)}
.pm-dot:hover,.pm-dot:focus-visible,.pm-dot.armed{background:var(--mark);border-color:var(--mark)}
.pm-more{position:absolute;right:-50px;top:50%;margin-top:-11px;height:22px;padding:0 7px;border:1px solid var(--line-strong);
  border-radius:11px;background:var(--panel);color:var(--dim);font:600 11.5px var(--mono)}
.pm-more:hover,.pm-more:focus-visible{color:var(--ink);border-color:var(--dim)}
.pm-stub{position:absolute;display:grid;place-items:center;border:1px dashed var(--line-strong);
  border-radius:var(--radius-sm);color:var(--dim);font-size:13px}
.pm-hint{position:absolute;font-size:13px;color:var(--mark);white-space:nowrap;pointer-events:none}
.pm-frame.linking .pm-node{border-style:dashed}
.pm-panel{position:absolute;right:14px;bottom:14px;width:360px;max-height:calc(100% - 28px);overflow:auto;
  display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-raised);box-shadow:0 8px 28px rgba(15,23,42,.14)}
/* The editor's Next field inside the panel: its rows are one line each, so their tracks may shrink below the titles. */
.pm-panel .kv,.pm-panel .cn-list,.pm-panel .cn-found{grid-template-columns:minmax(0,1fr)}
.pm-panel>.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pm-panel .pm-t{font-weight:600;font-size:14.5px}
.pm-panel .pm-to{color:var(--dim);display:grid}
.pm-panel .n{font-size:13px;color:var(--dim)}
.pm-teams{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.pm-team{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 8px}
.pm-team .tt{grid-column:1/-1;white-space:nowrap;overflow:hidden;font-size:14px}
.pm-team .n{white-space:nowrap}
/* WALK THE MAP (board 862), Claudia beta's sheet of 2026-10-06: the trail of the cards walked through, a crumb a step

/* ---- THE TOUR (board 720) ------------------------------------------------------------------
   Maxim ruled on 2026-09-21 that Studio's tour is visually the desk's, read strictly, so what
   follows is src/template.html's construction and not a redrawing of it. The PANEL is not here
   at all: it is the engine's own bubble.css, spliced in below by tools/bubble-css.mjs from the
   pinned commit, so a change to the family reaches both programs from one definition. What is
   here is what the desk's sheet keeps outside the family - the scrim, the hole cut in it, the
   panel's size and motion, and the prose, which the engine deliberately did not publish because
   the two programs' bubbles do not agree on it (E1, 2026-09-21). */
/* >>> THE ENGINE'S BUBBLE, SPLICED BY tools/bubble-css.mjs - DO NOT EDIT HERE <<< */
/* Etiuda - the bubble. Copyright (c) 2026 Maxim Gwiazda, Etiuda Source-Available
   Licence 1.0, LICENSE at the root of this repository.
   GENERATED by tools/build.mjs from the marked span of src/template.html. Edit it
   there. A host page owes this file the tokens the span names. */
/* THE BUBBLE, the shape every notice hangs off a control by, and the one thing in this sheet a
   SECOND program renders from: the build copies everything between these two markers into
   engine/bubble.css, and Studio links that file. So nothing keyed on a name this sheet owns
   belongs in here - only .bub, .bub-tip, .paper and the motion below - and a host owes the four
   tokens below, --panel-raised, --ink, --dim and --line for the paper voice, and the data-side
   attribute, which src/modules/bubble.js writes and Studio imports from the same commit. */
/* THE MOTION VOCABULARY, the family's and not this sheet's: tiers by what moves, one curve and
   one spring (motion.js M_MS, E_EASE and E_SPRING, held equal by tests/motion-tokens.js). A host
   sets html.e-still under either quiet switch; it zeroes every tier and halts every keyframe,
   so a rule written with the tiers needs no guard of its own. */
:root{--m-tone:100ms; --m-reveal:120ms; --m-move:180ms; --m-surface:180ms; --m-scrim:160ms;
  --m-resize:200ms; --m-dismiss:80ms; --m-travel:371ms; --m-celebrate:420ms; --m-wash:500ms;
  --m-roll:300ms; --m-nudge:2s;
  --m-ease:cubic-bezier(.2,.7,.3,1);
  --m-spring:linear(0,0.0773,0.2255,0.3951,0.5568,0.6956,0.806,0.8883,0.9458,0.9832,1.0055,1.0169,
    1.0212,1.0211,1.0186,1.0151,1.0115,1.0082,1.0054,1.0033,1.0018,1.0008,1.0001,1)}
:root.e-still{--m-tone:0s; --m-reveal:0s; --m-move:0s; --m-surface:0s; --m-scrim:0s;
  --m-resize:0s; --m-dismiss:0s; --m-travel:0s; --m-celebrate:0s; --m-wash:0s; --m-roll:0s;
  --m-nudge:0s}
:root.e-still *,:root.e-still *::before,:root.e-still *::after{animation:none!important}
/* THE FILL, cobalt in BOTH themes and the same blue as --accent-fill, written out because this span
   is published to host pages that carry none of the engine's tokens. A host redeclares the
   shadow per theme, which is the only one of the four a theme has ever moved. */
:root{--bub:#2563eb; --bub-ink:#fff; --bub-dim:rgba(255,255,255,.92); --bub-shadow:rgba(37,99,235,.32)}
/* position:fixed because placeBubble() writes viewport coordinates; overflow stays VISIBLE or
   the panel clips its own pointer; drop-shadow and not box-shadow, so the pointer carries the
   same shadow as the panel rather than one of its own. */
.bub{position:fixed;overflow:visible;pointer-events:auto;padding:12px 14px;
  background:var(--bub);color:var(--bub-ink);border:0;
  border-radius:14px;filter:drop-shadow(0 10px 22px var(--bub-shadow))}
/* THE POINTER: a square turned 45 degrees, half of it under the panel, so the two read as one
   piece of glass-free paper rather than as a box with a triangle glued on. Placed by
   placeBubble() along ONE axis; the side it hangs from pins the other, which is what these
   four rules are. It takes the panel's own fill from --bub, so the paper variant redeclares
   one token instead of repeating every rule. */
.bub-tip{position:absolute;width:12px;height:12px;background:var(--bub);
  transform:rotate(45deg);border-radius:2px;pointer-events:none}
.bub[data-side=below]>.bub-tip{top:-6px}
.bub[data-side=above]>.bub-tip{bottom:-6px}
.bub[data-side=right]>.bub-tip{left:-6px}
.bub[data-side=left]>.bub-tip{right:-6px}
.bub[data-side=none]>.bub-tip{display:none}
/* PAPER, the family's second voice and the card note's default: the same shape with the four
   tokens redeclared, so the pointer, the ink and the shadow follow the fill instead of taking
   a rule each. A note is somebody else's words, asked for, and the fill is the program's
   voice. The hairline is what separates paper from the page, since the fill no longer can. */
.bub.paper{--bub:var(--panel-raised);--bub-ink:var(--ink);--bub-dim:var(--dim);
  --bub-shadow:rgba(0,0,0,.22);border:1px solid var(--line)}
.bub.paper>.bub-tip{border:1px solid var(--line)}
.bub.paper[data-side=below]>.bub-tip{border-right:0;border-bottom:0;top:-7px}
.bub.paper[data-side=above]>.bub-tip{border-left:0;border-top:0;bottom:-7px}
.bub.paper[data-side=right]>.bub-tip{border-right:0;border-top:0;left:-7px}
.bub.paper[data-side=left]>.bub-tip{border-left:0;border-bottom:0;right:-7px}
/* >>> END OF THE ENGINE'S BUBBLE <<< */
/* STUDIO'S BUBBLE IS VIOLET (Max, 2026-11-15: "I agree with chaing bubbles to violet in Studio."): the one fill token
   redeclared for Studio alone, after the engine's span so it wins, the title band's own violet (--band); the desk's bubble stays
   blue. The light shadow follows the fill. The dark theme takes the lighter violet Max chose from the product designer's sheet
   (2026-11-15: "I prefer option B.") with a soft glow in its own hue in place of the black shadow above. */
:root{--bub:#5729a6; --bub-shadow:rgba(87,41,166,.32)}
:root[data-theme=dark]{--bub:#6d3fc4; --bub-shadow:rgba(124,58,237,.30)} /* a soft glow in its own colour, weaker than the light theme's (Max 2026-11-15; the product designer's value) */

/* NOTHING IS DARKENED AND NOTHING IS HELD, as on the desk: the page under the tour stays usable,
   only the panel takes a click, and the ring in the panel's colour says where a step points.
   z-index 240 clears Studio's layers, which stop at 5. */
#tourRoot{position:fixed;inset:0;z-index:240;pointer-events:none}
/* A COMPANY PROXY'S QUESTION (ui/proxy-ask.js): the paper bubble centred on the window, above the tour and every cover, since a
   call waits on it whatever is on screen. */
.s-proxy-ask{left:50%;top:50%;transform:translate(-50%,-50%);z-index:250;width:min(340px,calc(100vw - 28px));
  display:flex;flex-direction:column;gap:8px}
.s-proxy-ask h3{margin:0;font-size:15.5px;font-weight:700;font-family:var(--sans-display)}
.s-proxy-ask p{margin:0;font-size:13.5px;line-height:1.5;color:var(--bub-dim)}
.s-proxy-ask .s-proxy-at{white-space:normal;overflow-wrap:anywhere}
.s-proxy-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
/* Hung from its origin (app.js proxyAskHang): the blue fill, the placing's own coordinates, the desk's field and buttons on it. */
.s-proxy-ask.hung:not([data-side=none]){transform:none}
.s-proxy-ask.hung h3{color:var(--bub-ink)}
.s-proxy-ask.hung .field{background:#fff;color:#0f172a;border-color:transparent}
.s-proxy-ask.hung .btn{background:rgba(0,0,0,.14);color:#fff;border-color:transparent;font-weight:600}
.s-proxy-ask.hung .btn.solid{background:#fff;border-color:#fff;color:var(--bub)}
/* THE NAMED PERSON'S OWN PRESS (app.js namingMount; board 1011): the same bubble, a soft disc with the owner's initials leading its heading. */
.s-naming h3{display:flex;align-items:center;gap:8px}
.s-naming .nm-ini{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.22);color:var(--bub-ink);font-size:10.5px;font-weight:700;letter-spacing:.02em}
.s-naming.hung p{color:var(--bub-ink)}
.tour-hole{position:fixed;z-index:1;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 2.5px var(--bub);
  transition:top .28s cubic-bezier(.2,.7,.3,1),left .28s cubic-bezier(.2,.7,.3,1),
    width .28s cubic-bezier(.2,.7,.3,1),height .28s cubic-bezier(.2,.7,.3,1),
    border-radius .2s ease,opacity .2s ease;opacity:0}
#tourRoot.on .tour-hole{opacity:1}
/* The panel's own size and motion. Everything that makes it a bubble - the fill, the padding,
   the radius, the shadow and the pointer - is above, in the engine's bytes. */
.tour-card{z-index:3;width:min(360px,calc(100vw - 28px));
  opacity:0;transform:translateY(8px);
  transition:top .28s cubic-bezier(.2,.7,.3,1),left .28s cubic-bezier(.2,.7,.3,1),
    opacity .22s ease,transform .28s cubic-bezier(.2,.7,.3,1)}
#tourRoot.on .tour-card{opacity:1;transform:translateY(0)}
.tour-card h3{margin:0 0 6px;font-size:15.5px;letter-spacing:-.2px;font-weight:700;
  font-family:var(--sans-display)}
.tour-card p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:var(--bub-dim);
  text-wrap:balance}
/* THE BODY SCROLLS, NEVER THE PANEL, which is what keeps the three buttons on screen when a
   step is long. Studio's steps are longer than the desk's - they are an argument rather than a
   label - so this rule does more work here than it does there. */
#tourBody{max-height:min(46vh,300px);overflow:auto}
.tour-card p b{color:var(--bub-ink);font-weight:600}
/* A placeholder quoted inside a step. The page's own .mono reads the page's ink, which on a
   filled cobalt panel is invisible; one rule, and it takes the panel's ink like everything
   else in the family. */
.tour-card .mono{font-family:var(--mono);font-size:12.5px;color:var(--bub-ink)}
.tour-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px}
/* ON A FILLED PANEL A QUIET INK IS AN ILLEGIBLE ONE: the quiet of a step counter comes from
   11px mono caps, not from lowering the contrast, so it takes the body's own ink. The desk
   measured this and the finding carries over unchanged. */
.tour-step{font:11px var(--mono);color:var(--bub-dim);letter-spacing:.3px;
  text-transform:uppercase}
.tour-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;
  margin-top:2px;padding-top:10px;border-top:1px solid rgba(255,255,255,.24)}
/* CUT INTO THE FILL, NOT OUT OF IT. The desk's measurement: white ink on a white-washed ghost
   is 4.04:1 and gets worse as the hover lightens it, so a secondary button on a filled notice
   is a shadow in it - 6.52:1 at rest, 8.02:1 hovered. */
.tour-actions .btn{background:rgba(0,0,0,.14);color:#fff;border-color:transparent;
  font-weight:600}
.tour-actions .btn:not([disabled]):hover,.tour-actions .btn:not([disabled]):focus-visible{
  background:rgba(0,0,0,.26);color:#fff;border-color:transparent}
.tour-actions .btn.primary,.tour-actions .btn.primary:hover,
.tour-actions .btn.primary:focus-visible{
  background:#fff;border-color:#fff;color:var(--bub);font-weight:600}
.tour-actions .btn.primary:hover,.tour-actions .btn.primary:focus-visible{filter:brightness(.94)}
.tour-actions .tour-skip{margin-right:auto}
/* THE INVITE, the same panel with its own words, hung off the Menu button. It is NOT inside
   #tourRoot: the root is the tour running, and the invite is the offer of it. */
#tourInvite{top:0;left:0;z-index:241;width:min(300px,calc(100vw - 28px))}
#tourInvite h3{margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:-.2px;
  font-family:var(--sans-display)}
#tourInvite p{margin:0 0 12px;font-size:13px;line-height:1.45;color:var(--bub-dim);
  text-wrap:balance}
/* A COVER IS IN FRONT OF THE INVITE AND UNDER IT AT ONCE, which is a floating panel's one
   real hazard here: the Menu button opens the desk-settings cover, and the invite hangs off that
   very button. So while a cover is up the invite stands down. The engine does the same for its
   own two covers. IT IS #scrim AND NOT #dlg: `#dlg` is always in the document and always

   true` and `$("#dlg").innerHTML = ""`). The tour stands down the same way, as the desk's goes behind its windows. */
