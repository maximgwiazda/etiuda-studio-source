/* PROPOSAL A, "Refined" (board 975). Max chose it on 2026-11-10 ("I definitely prefer A") and agreed the build.
   The drawing is studio-a.css of that day. These rules sit last so they win. Colours, type and actions are unchanged.
   A pane's lift is a drop-shadow filter. The pane keeps overflow hidden and its radius, which clips an outer box-shadow,
   so the drawing's box-shadow would not paint. Dark panes keep no lift: item 4 leaves the dark lift unchanged, and the
   drawing applies one shadow in both themes, so the dark half is left for the designer. */
:root{
  --dots-ink:color-mix(in srgb,var(--dim) 42%,transparent);
  --chip:color-mix(in srgb,var(--ink) 6%,transparent);
  --chip-ink:var(--ink);
  --chip-on:color-mix(in srgb,var(--mark) 13%,transparent);
}
:root[data-theme=dark]{
  --dots-ink:color-mix(in srgb,var(--dim) 30%,transparent);
  --chip:color-mix(in srgb,var(--ink) 9%,transparent);
  --chip-on:color-mix(in srgb,var(--mark) 22%,transparent);
}
#main{
  background-image:radial-gradient(circle at center,var(--dots-ink) 0 .7px,transparent 1.2px);
  background-size:16px 16px;
}
/* WORDS ON THE DOTTED PAGE STAND ON THE PAGE'S GROUND, EACH LINE ON ITS OWN, so no dot crosses a letter and the dots give way only
   where the words are (the product owner, 2026-11-15: the cleared rectangle "the size of the text and no wider"). The pass in
   ui/app.js (dgPass) puts each text block's own words into one inline box, .dg-hug, which breaks its background line by line:
   the page's colour, a 3 px spread (the desk's own .e-dot-hug), a plain edge. A block of its own could not do it: a wrapped
   paragraph's box is its container's width, and its short last line cleared the dots to the right. A flex or grid parent's text
   is the item .dg-item holding the hug, so the item shrinks to the words. An icon carries its own ground, and a control or a box with a tint (.dg-ctrl)
   the page's colour under it in every state, one rule below. A control with a ground of its own, a pane, a table and what stands on them are
   not touched. THE CLEARING LIES UNDER EVERYTHING (z-index -1 in the ground's own stacking context, #main and the door's left half are isolated):
   an inline box's background is painted after every block's background and border in its context, so its 3 px spread painted over the top
   border of the box below a heading and the edge of a pane; at the lowest layer it can reach only the dots. The words stand in a box of their own above it (.dg-t): an inline
   box paints its background line by line, each line's after the one before's words, so a line's 3 px spread painted over the descenders of the
   line above when the words stood in the patch's own layer. tests/dots-hug.mjs and
   tests/dots-ground-only.mjs hold it. */
.dg-hug{display:inline; /* plant:dots-hug */
  position:relative;z-index:-1; /* plant:dots-under-all */
  background:var(--bg);box-shadow:0 0 0 3px var(--bg);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.dg-t{position:relative; /* plant:dots-words-above */}
.dg-item{min-width:0}
.dg-ic{position:relative;z-index:-1;background:var(--bg);box-shadow:0 0 0 3px var(--bg)}
/* THE ONE RULE FOR A THING WITH A TINT OF ITS OWN ON THE GROUND, in every state (the designer, 2026-11-16: the hover tint made opaque by the
   ground's own colour). The page's colour is a layer UNDER the thing, a pseudo-element at z-index -1 in the ground's stacking context
   (#main and the door's left half are isolated for it), so whatever the thing paints over it, its rest tint, its hover, focus or press
   tint, a chosen part's fill, is mixed with the page's colour and is the colour it has over a plain page. The layer reaches 3 px past
   the box, as a hug's spread does. A thing that is not positioned is made so (.dg-rel). A control that is an input, a select or a
   textarea cannot have the layer (no pseudo-element) and keeps its own ground, which each of Studio's has opaque. */
#main,.si-door .l{isolation:isolate}
.dg-rel{position:relative}
.dg-ctrl::after{content:"";position:absolute;inset:-3px;z-index:-1;border-radius:inherit;background:var(--bg);pointer-events:none} /* plant:dots-under */
.dashed.empty .empty-ic.dg-ic{background:color-mix(in srgb,var(--mark) 10%,var(--bg))}
:root[data-theme=light] .pane{filter:drop-shadow(0 1px 2px rgba(15,23,42,.05))}
.cell-chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:7px;background:var(--chip);color:var(--chip-ink);font-size:12.5px;white-space:nowrap}
.cell-chip.full{background:var(--chip-on);color:var(--mark);font-weight:600}
.cell-chip.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--dim)}
.chrome .seg{border-radius:9px}
.chrome .seg span{border-radius:7px}
.count{border-radius:6px}
.shelf .tile{box-shadow:inset 0 3px 0 var(--ecat),0 1px 2px rgba(15,23,42,.05)}
/* A MODEL'S DRAFT AND THE JOBS THAT ASK FOR ONE (board 992, stage 4; the product designer's surfaces.md, section 1). The
   queue's tag and the draft's bar are the import marker's colour (--mark, as .mkn): one thing in two views, marked as a
   proposal from an import is. The bar is 3 px down the marked field's left edge. A job's line sits in the button's place and
   wraps rather than pushing the field wider; its host and model are monospace, as .mono is, in the line's own ink. */
.chip.model{background:transparent;color:var(--mark);border-color:var(--mark)}
.ai-draft{box-shadow:inset 3px 0 0 var(--mark);padding-left:9px}
.ai-draft-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.ai-job{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.ai-job .ai-say{flex:1 1 220px;min-width:0}
.ai-job .mono,.ai-draft-head .mono{color:inherit;white-space:normal;overflow-wrap:anywhere}
/* SIGN-IN (board 980): Studio's door, Settings' Account, the rail's way back and the band's account panel, as the product
   designer's round two draws them (her si.js and si2.js). A moment that cannot be done has no box of its own: its fact is the
   heading of the place that asked, and amber is only ever the stopped step's ring or a 9 px dot. */
:root{--si-ok:var(--state-ok);--si-warn:var(--state-look)}
.va .work:has(> #main > .si-door){grid-template-columns:1fr}
.va .work:has(> #main > .si-door) .rail{display:none}
#screen:has(#main > .si-door) #tabs,#screen:has(#main > .si-door) #btnPlaces,#screen:has(#main > .si-door) .band .sep{visibility:hidden}
#main:has(> .si-door){background-image:none}
.si-door{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr);min-height:100%}
.si-door .l{padding:8vh 6vw 48px;display:flex;flex-direction:column;
  background-image:radial-gradient(circle at center,var(--dots-ink) 0 .7px,transparent 1.2px);background-size:16px 16px}
/* THE DOOR'S MARK CARRIES NO LINE. It is the band's drawing in a span of the class .mk, which is also the import marker's class, so the
   marker's wavy swash under its words came with it (the product owner, 2026-11-15: the line under the Studio mark "looks bad"). Door only:
   the band's mark and the About's head have no .mk. */
.si-door .mk,.si-door .mk:hover{width:52px;height:52px;color:var(--mark);margin-bottom:26px;background:none;padding-bottom:0} /* plant:door-mark-line */
.si-door .mk svg{width:52px;height:52px}
#main .si-door h1{font:300 40px/1.15 var(--sans-display);letter-spacing:-.015em;margin:0 0 14px;max-width:14em}
#main .si-door .l .lede{font-size:16.5px;line-height:1.5;margin:0 0 30px;max-width:30em}
.si-door .l .ft{margin-top:auto;padding-top:24px;font-size:12.5px;color:var(--dim)}
.si-door .r{border-left:1px solid var(--line);background:var(--panel);padding:calc(8vh + 78px) 44px 48px;display:flex;flex-direction:column}
#main .si-door .r h2{font:600 19px/1.3 var(--sans-display);margin:0 0 8px;background:var(--panel);box-shadow:none}
#main .si-door .r .lede{font-size:14px;line-height:1.5;margin:0 0 20px;background:var(--panel);box-shadow:none}
/* The panel's text on one measure, 460px; the providers' caption sits 14px under the line above it and 10px over the buttons. */
#main .si-door .r :is(h2,.lede,.si-cap){max-width:460px}
#main .si-door .r .lede:has(+ .si-cap){margin-bottom:0}
#main .si-door .r .lede + .si-cap{margin:14px 0 10px}
@media (max-width:1000px){.si-door{grid-template-columns:minmax(0,1fr) minmax(340px,1fr)}.si-door .l{padding:6vh 32px 32px}
  #main .si-door h1{font-size:32px}.si-door .r{padding:calc(6vh + 78px) 28px 32px}}
@media (max-width:760px){.si-door{grid-template-columns:minmax(0,1fr)}.si-door .r{border-left:0;border-top:1px solid var(--line);padding:28px}}
.si-h{font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.si-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:si}
.si-steps li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--dim);counter-increment:si}
.si-steps li::before{content:counter(si);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line-strong);font:600 11.5px/1 var(--sans);flex:none;background:var(--bg)}
.si-steps li.done::before{content:"\2713";background:var(--si-ok);border-color:var(--si-ok);color:var(--panel);font-size:12px}
.si-steps li.now{color:var(--ink);font-weight:600}
.si-steps li.now::before{border-color:var(--mark);color:var(--mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--mark) 22%,transparent)}
.si-steps li.stop{color:var(--ink);font-weight:600}
.si-steps li.stop::before{content:"";border-color:var(--si-warn);background:radial-gradient(circle,var(--si-warn) 0 3.2px,transparent 3.8px)}
/* The providers' own buttons, the two the same size: their colours, faces and spacing, dark on the dark theme. */
.si-provs{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.si-provs .si-p{width:100%}
.si-provs.row{flex-direction:row;flex-wrap:wrap;width:auto;max-width:none}
.si-provs.row .si-p{width:auto}
.si-p{display:inline-flex;align-items:center;justify-content:center;height:41px;padding:0 12px;border:1px solid;border-radius:4px;white-space:nowrap;flex:none}
.si-p svg{flex:none}
.si-p.ms{gap:12px;font:600 15px/1 "Segoe UI",sans-serif;background:#fff;border-color:#8c8c8c;color:#5e5e5e}
.si-p.g{gap:10px;font:500 14px/20px "Google Sans",Roboto,"Segoe UI",sans-serif;background:#fff;border-color:#747775;color:#1f1f1f}
:root[data-theme=dark] .si-p.ms{background:#2f2f2f;border-color:#2f2f2f;color:#fff}
:root[data-theme=dark] .si-p.g{background:#131314;border-color:#8e918f;color:#e3e3e3}
.si-p:disabled{opacity:.55}
.si-cap{font-size:12.5px;line-height:1.45;color:var(--dim);margin:10px 0 0;max-width:36em}
/* The sign-in preview's line (ui/app.js previewLine), the one-line form of the handoff's section 5 with no dot: its first sentence
   in the ink at 600, the rest the caption's own. On the door it sits between the panel's line and the providers' caption. */
.si-cap.si-preview b{color:var(--ink);font-weight:600}
.si-rf .si-preview{flex:1 0 100%;margin:0}
#main .si-door .r .lede + .si-cap.si-preview{margin:12px 0 10px}
#main .si-door .r h2 + .si-cap.si-preview{margin:4px 0 10px}
#main .si-door .r .si-preview + .si-cap{margin:0 0 10px}
.sx-row.si-top .si-preview{max-width:none;margin:10px 0 10px}
/* The sign-in link while the browser is awaited (ui/app.js signInLinkHtml, the handoff's section 8): the line in the preview line's
   form, 6 px, then the field, which takes the width left, never wraps and cuts the link's end. On the door 16 px under the acts at
   the panel's 460 px; in Account 12 px under them (the card's 14 px row gap less 2), the field at most 560 px. */
.si-link{width:100%;min-width:0}
.si-link .si-cap{margin:0;max-width:none}
.si-link .si-cap b{color:var(--ink);font-weight:600}
.si-link-row{display:flex;gap:8px;align-items:center;margin-top:6px;min-width:0}
/* A reference, so in the ordinary weight and the dim ink. */
input.field.si-link-f{flex:1 1 auto;min-width:0;width:auto;height:28px;font:400 12.5px var(--mono);color:var(--dim);white-space:nowrap}
.si-link-row .btn{flex:none}
/* The sign-in's Copy (ui/app.js signInCopyBtn): "Copy" and "Copied" share one cell, so the button holds the wider label's width. */
.si-copy-l{display:inline-grid;justify-items:center}
.si-copy-l>span{grid-area:1/1}
.si-copy-l>span+span,.si-copy.done .si-copy-l>span:first-child{visibility:hidden}
.si-copy.done .si-copy-l>span+span{visibility:visible}
#main .si-door .r .si-link{margin-top:16px;max-width:460px}
.sx-row.si-top .si-link{flex:1 1 100%;margin-top:-2px}
.sx-row.si-top input.field.si-link-f{max-width:560px}
.sx-row.si-top .si-unkept{flex:1 1 100%;max-width:none;margin:0}
.si-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.si-acts .btn.q{border-color:transparent;background:transparent;color:var(--dim)}
.si-wait{font-size:13.5px;color:var(--dim)}
.si-run{position:relative;height:2px;width:min(100%,340px);background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.si-run::after{content:"";position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--mark);border-radius:2px;animation:si-run 1.6s ease-in-out infinite alternate}
@keyframes si-run{from{left:0}to{left:66%}}
:root.e-still .si-run::after{animation:none;left:28%}
@media (prefers-reduced-motion:reduce){.si-run::after{animation:none;left:28%}}
/* Account, in Settings: the identity card above Studio's own rows, and the owner's lead seats. */
.sx-row.si-top{display:flex;gap:14px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px}
.sx-row.si-top.col{flex-direction:column;align-items:flex-start}
.si-top .a{display:flex;gap:8px;flex-wrap:wrap}
.si-id{display:flex;gap:13px;align-items:center;min-width:0}
.si-id b{display:block;font-size:16px;line-height:1.3}
.si-id small{display:block;font-size:13px;line-height:1.45;color:var(--dim);max-width:44em}
.si-av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:color-mix(in srgb,var(--mark) 24%,var(--panel));color:var(--ink);flex:none;position:relative}
.si-av .ic{width:58%;height:58%}
.si-av.s{width:22px;height:22px}
.si-av.off::after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--dim);background:var(--panel)}
.si-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--si-warn);margin-right:8px;vertical-align:middle}
/* The administrator's view (decision 49): who decides, in the identity's label weight under its name, and the locked mark at a
   row's right, the value as text and no control drawn. */
.si-id .si-managed{display:block;font-size:13.5px;font-weight:600;line-height:1.4;margin:2px 0 4px}
.si-lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin-left:12px;white-space:nowrap}
.si-lock .ic{width:13px;height:13px;flex:none}
.si-mono{font:600 14.5px var(--mono);letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.si-val{font-size:13.5px;color:var(--ink)}
/* A managed installation (decision 49): who decides, under the identity's first line, and a row the organisation set, marked
   with a lock at its right and no control drawn, so nothing looks pressable (the product designer's handoff, section 1). */
.si-id .si-managed{display:block;margin:2px 0 4px;font-size:13.5px;font-weight:600;color:var(--ink)}
.si-lock{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.si-lock .ic{width:14px;height:14px}
.si-sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.si-sh span{font-size:12.5px;color:var(--dim)}
.sx-row.si-seat{min-height:0}
.si-seat .t{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.si-seat .field{width:230px;max-width:100%}
.si-seat .tag{font-size:12.5px;color:var(--dim)}
.sx-row.si-seat.gone{background:color-mix(in srgb,var(--si-ok) 8%,var(--panel))}
.si-seat.empty .si-mono{color:var(--dim);font-weight:400}
/* A step drawn before it can be taken (Account's Carry on from another computer): its label in the dim ink, as its line is. */
.sx-row.si-later .t b{color:var(--dim)}
.si-under{font-size:12.5px;line-height:1.5;color:var(--dim);margin:10px 2px 0;max-width:62em}
#main .si-sh > *,#main .si-under{background:var(--bg);box-shadow:0 0 0 5px var(--bg);border-radius:4px}
#main .si-under{display:table}
/* A team is its lead's own (decision 47, held for Max's ruling; the product designer's design of 2026-11-13): the choice of two, each a
   row with its radio; the card asked once, its accent edge at the left; the band's person button's dot while it waits. */
.sx-row.si-radio{align-items:center}
.si-rd{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);display:inline-grid;place-items:center;margin-right:2px}
.si-radio.on .si-rd{border-color:var(--mark)}
.si-radio.on .si-rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mark)}
.sx-card.si-ask{border-left:3px solid var(--mark)}
.si-sh.si-in{padding:6px 18px 0}
.si-code-in{min-width:280px;max-width:100%}
#btnAcct.si-ask-dot{position:relative}
#btnAcct.si-ask-dot::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 2px var(--chrome)}
/* The way back to the door at the rail's foot, and the band's account panel. */
.rail:has(> .si-rf){display:flex;flex-direction:column}
.si-rf{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.si-rf .ic{width:16px;height:16px;flex:none}
.si-rf span{flex:1 1 auto}
.si-pop{position:fixed;z-index:9;width:min(372px,calc(100vw - 28px));padding:14px;border:1px solid var(--line-strong);border-radius:12px;
  background:var(--panel-raised,var(--panel));box-shadow:0 12px 34px rgba(0,0,0,.24);font-size:13.5px}
.si-pop .si-id{margin-bottom:10px}
.si-pop .ln{display:flex;gap:8px;align-items:center;color:var(--dim);line-height:1.4;margin-top:6px}
.si-pop .ln .ic{width:16px;height:16px}
.si-pop .si-acts{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.si-pop .si-id code{display:block;font:12.5px var(--mono);color:var(--dim)}
#btnAcct[aria-expanded="true"]{box-shadow:0 0 0 2px color-mix(in srgb,var(--band-ink) 40%,transparent)}
/* A paid act on a Studio nobody signed in to: one sentence in the screen's own type, its first half in ink at 600 and the second
   dimmed, then Sign in. No colour, icon or box. */
#main .si-paid{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:13.5px;color:var(--dim)}
#main .si-paid b{font-weight:600;color:var(--ink)}
/* The lead's list of people who signed in, in the Roster between Asking to join and Members, and Admit by sign-in code. */
.si-people{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:0 0 12px}
.si-prow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line)}
.si-people>.si-prow:first-child{border-top:0}
.si-prow>.ic{width:18px;height:18px;color:var(--dim)}
.si-prow .t{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.si-prow .t .field{width:230px;max-width:100%}
.si-prow .c{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.si-prow .tag{font-size:12.5px;color:var(--dim)}
.si-prow .sx-sub{grid-column:2 / -1}
.si-prow.got{grid-template-columns:22px minmax(0,1fr);background:color-mix(in srgb,var(--si-ok) 8%,var(--panel));font-size:13.5px;line-height:1.45}
.si-pcode{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.si-pcode .k{font-size:12.5px;color:var(--dim)}
.si-pcode .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.si-pcode .field{width:230px;max-width:100%}
.si-pcode .si-prow.got{border:1px solid var(--line);border-radius:var(--radius-sm)}
/* BOARD 1017, A PERSON BY NAME AND ADDRESS (the product designer's sheet of 2026-11-22, name-by-address.png): the waiting row grey, the confirm
   row the one in the mark colour, the provider's facts as pills, the naming field's matches under it. */
.si-who{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.si-who b{font-weight:600;color:var(--ink)}
.si-who .ad{font-size:13px;color:var(--dim)}
.si-prow .t.si-t-row{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.si-addr,.si-seat .field.si-addr,.si-pcode .field.si-addr{width:340px;max-width:100%}
.sx-row.si-wait,.si-prow.si-wait{background:color-mix(in srgb,var(--line) 32%,var(--panel))}
.sx-row.si-confirm,.si-prow.si-confirm{background:color-mix(in srgb,var(--mark-fill) 9%,var(--panel));box-shadow:inset 3px 0 0 var(--mark-fill)}
.si-confirm>.ic{color:var(--mark)}
.si-facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:6px}
.si-facts span{font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--panel)}
.si-said{display:block;color:var(--dim);font-size:12.5px;line-height:1.45}
.si-said.si-several{color:var(--ink);margin-bottom:4px}
.si-state{font-size:12.5px;color:var(--ink)}
.si-name-t{position:relative}
.si-sug-at{position:relative;width:100%}
.si-sug{position:absolute;left:0;top:4px;min-width:420px;max-width:100%}
.si-sug .mi .ad{color:var(--dim);font-size:12.5px}
.si-sug .hd{font-size:11.5px;color:var(--dim);padding:4px 10px 2px;letter-spacing:.04em;text-transform:uppercase}
.si-sug-hint{font-size:12.5px;color:var(--dim);padding:4px 10px}
.si-gap{flex:1 1 auto}
/* THE TEAM SCREEN KEEPS EVERY COLUMN AND ACT IN REACH (board 993). The Members table needs about 650px at its narrowest, its words
   whole, its key and headings wrapping between words (tests/sign-in.mjs si39 holds the budget), so the Roster and Who can read what
   you publish stand one above the other until a pane can hold it: two panes only from 1900px. */
.cols.team-cols{grid-template-columns:minmax(0,1fr)}
@media (min-width:1900px){ .cols.team-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
/* 1900px is measured with one corner disc's 78px; two or three take 132 or 186px (--disc-room), so there the panes stay stacked
   to 2008px. */
@media (min-width:1900px) and (max-width:2007.98px){ body:is([data-discs="2"],[data-discs="3"]) .cols.team-cols{grid-template-columns:minmax(0,1fr)} }
#main .team-cols table.desks .ksig,#main .team-cols table.desks .ksig .mono,#main .team-cols table.desks th{white-space:normal}
#main .team-cols table.desks td .btn{margin:2px 0}
/* The key cell of Members never breaks, whatever the width; the headings and the other words still wrap between words. */
#main .team-cols table.desks td.kcell,#main .team-cols table.desks td.kcell .ksig,#main .team-cols table.desks td.kcell .ksig .mono{white-space:nowrap}
/* THE SMALL QUESTIONS ARE THE DESK'S BUBBLE (app.js coverBubble): the scrim dims nothing and takes no press, #dlg wears the
   pinned .bub, and inside it the desk's ask type (its .bub-ask) and its buttons on the fill (its .tour-actions). */
.scrim.bubbled{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none;padding:0}
.scrim.bubbled>.dlg.bub{pointer-events:auto;display:block;width:min(480px,calc(100vw - 24px));max-width:none;max-height:none;
  overflow:visible;box-shadow:none;padding:12px 14px}
.dlg.bub h2{padding:0;margin:0 0 6px;font:700 15.5px var(--sans-display);letter-spacing:-.2px;color:var(--bub-ink)}
.dlg.bub .body{padding:0;overflow:visible}
.dlg.bub .lede,.dlg.bub p{padding:0;margin:0 0 8px;font-size:13.5px;line-height:1.5;color:var(--bub-dim);text-wrap:pretty}
.dlg.bub .kv,.dlg.bub .kv .k,.dlg.bub .kv .n,.dlg.bub label{color:var(--bub-ink)}
/* A field's label is said in the bubble's own line, as the desk's "Type RESET to confirm.", and no rule divides it. */
.dlg.bub .kv{gap:0;padding:0 0 8px;border-top:0}
.dlg.bub .kv .k{font:13.5px/1.5 var(--sans);letter-spacing:0;text-transform:none}
.dlg.bub .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;background:none;
  margin-top:4px;padding:0;border-top:0}
.dlg.bub .btn{background:rgba(0,0,0,.14);color:#fff;border-color:transparent;font-weight:600}
.dlg.bub .btn:not([disabled]):hover,.dlg.bub .btn:not([disabled]):focus-visible{background:rgba(0,0,0,.26);color:#fff;border-color:transparent}
.dlg.bub .btn.solid,.dlg.bub .btn.solid:not([disabled]):hover,.dlg.bub .btn.solid:not([disabled]):focus-visible{background:#fff;border-color:#fff;color:var(--bub)}
.dlg.bub input:not([type=checkbox]):not([type=radio]),.dlg.bub textarea{box-sizing:border-box;margin:4px 0 0;padding:7px 9px;
  border:1px solid transparent;border-radius:8px;background:#fff;color:#0f172a;font:13.5px var(--sans)}
.dlg.bub input:not([type=checkbox]):not([type=radio]){height:auto}
.dlg.bub input.mono{font-family:var(--mono)}
.dlg.bub textarea::placeholder,.dlg.bub input::placeholder{color:#64748b}
.dlg.bub input:focus-visible,.dlg.bub textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* The Undo, the desk's one line and its button on the fill (app.js undoBubble); where it rests, the bar's own place. */
.undo.bub{z-index:6;border-top:0;padding:12px 14px;gap:14px;width:fit-content;max-width:calc(100vw - 24px)}
.undo.bub[data-side=none]{position:relative;margin:0 auto 12px}
.undo.bub span{color:var(--bub-ink)}
.undo.bub .ic{color:var(--bub-ink)}
.undo.bub .btn,.undo.bub .btn:not([disabled]):hover,.undo.bub .btn:not([disabled]):focus-visible{background:#fff;border-color:#fff;
  color:var(--bub);font-weight:600}
.undo.bub .key{color:var(--bub-dim);border-color:rgba(255,255,255,.4)}
/* The close control: a bare mark beside Undo that only puts the offer away. */
.undo.bub .btn.undo-x,.undo.bub .btn.undo-x:not([disabled]):hover,.undo.bub .btn.undo-x:not([disabled]):focus-visible{background:transparent;border-color:transparent;
  color:var(--bub-ink);padding:4px;min-width:0;line-height:0}
.undo.bub .btn.undo-x{opacity:.75}
.undo.bub .btn.undo-x:hover,.undo.bub .btn.undo-x:focus-visible{opacity:1}
.undo.bub .btn.undo-x .ic{width:14px;height:14px}
/* Dark floating surfaces: Menu and Variables pick up 10px corners and dialog shadow; all five carry the quiet 1px rim and #1d1f24 raised ground. */
:root[data-theme=dark] .menu-list,
:root[data-theme=dark] .vr-menu{border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
:root[data-theme=dark] .dlg:not(.bub):not(.press),
:root[data-theme=dark] .menu-list,
:root[data-theme=dark] .si-pop,
:root[data-theme=dark] .vr-menu,
:root[data-theme=dark] .pm-panel{border-color:var(--line);background-color:var(--win-raised)}
@supports (background-clip:border-area){
  :root[data-theme=dark] .dlg:not(.bub):not(.press),
  :root[data-theme=dark] .menu-list,
  :root[data-theme=dark] .si-pop,
  :root[data-theme=dark] .vr-menu,
  :root[data-theme=dark] .pm-panel{
    border-color:transparent;
    background-image:linear-gradient(var(--win-raised),var(--win-raised)),var(--rim),linear-gradient(var(--line),var(--line));
    background-origin:padding-box,border-box,border-box,border-box,border-box,border-box;
    background-clip:padding-box,border-area,border-area,border-area,border-area,border-area}
}
</style>

    <p id="pressedKey" hidden></p>
    <div class="tour-actions">
      <button type="button" class="btn sm" id="pressedBackup" data-act="pressed-backup" hidden></button>
      <button type="button" class="btn sm primary" id="pressedArchive" data-act="pressed-archive"></button>
    </div>
  </div>
  <div class="chrome" id="chrome"></div>
  <div class="work">
    <nav class="rail" id="rail"></nav>
    <div class="main" id="main"></div>
  </div>
  <!-- THE UNDO BAR (board 834, step 6, C07): the foot of the work area after a delete, until the
       next change. Static, like the discs, so that a paint of #main never takes it down. -->
  <div class="undo" id="undo" hidden></div>
  <!-- THE BAR FOR THE TICKED CARDS (board 834, step 10, C09): the undo bar's twin at the foot, static for the same reason. -->
  <div class="undo bulk" id="bulk" hidden></div>
  <!-- THE DISCS IN THE CORNER (board 616). Static, like the band's two buttons and like
       the engine's own pair: ui/app.js gives each its glyph, its title and its state, and the
       element itself stays put so that a disc arriving can fade in rather than appear. Order
       reads right to left, as the corner does: the making act nearest the corner, then the
       review, then the signing key's backup. -->
  <div class="discs" id="discs" hidden>
    <button type="button" class="disc q" id="discBackup" data-act="key-backup"
            tabindex="-1" aria-hidden="true"></button>
    <button type="button" class="disc q" id="discReview" data-act="disc-review"
            tabindex="-1" aria-hidden="true"></button>
    <button type="button" class="disc" id="discNew" data-act="card-new"></button>
  </div>
  <!-- THE MARKER PEN'S PANEL (board 604). Static, like the corner's discs and for the same reason:
       an innerHTML container would re-create these elements on every paint. It sits outside
       #main because paintMain() replaces #main entirely, and outside the body's scroller
       because a panel inside one does not float - ui/app.js places it from the mark's rect.
       The button is tabindex -1: it is reached only by Tab from the mark it belongs to, which
       is the order mkStep() puts back by hand. -->
  <div class="mktip" id="mkTip" role="tooltip" hidden>
    <span class="k" id="mkTipK"></span>
    <span class="was" id="mkTipWas"></span>
    <button type="button" class="mkput" id="mkTipPut" data-act="rv-mark" tabindex="-1"></button>
    <i aria-hidden="true"></i>
  </div>
  <div class="foot" id="foot" hidden></div>
  <!-- THE STATUS BAR (F3, 2026-10-06), the window's last strip. Static, like the discs: ui/app.js
       paintStatus() fills its two halves and says only the save states that need a person into its
       own polite region, so a keystroke's traffic is never spoken. -->
  <footer class="sbar" id="sbar">
    <span class="sb-l" id="sbLeft"></span><span class="sp"></span><span class="sb-r" id="sbRight"></span>
    <span class="sr" id="sbSaid" role="status" aria-live="polite"></span>
  </footer>
  <!-- THE STATUS LINE (sense pass 3, item 26). Static, outside #main, because a live region a
       paint replaces is never read: ui/app.js says every refusal and every aftermath into it. -->
  <div class="sr" id="said" role="status" aria-live="polite"></div>
  <!-- PROJECTS AS PLACES (board 862): last in the screen, so a copy of a window inside it is never the first #main a
       script finds; ui/app.js placesOpen() fills it. -->
  <div class="places" id="places" role="dialog" aria-modal="true" hidden></div>
  <!-- THE VEIL (board 862, Drop then triage): a dashed edge round the work while a file is held over the
       window, solid once it is let go. It takes no pointer, so the drag still lands on the page below. -->
  <div class="veil" id="veil" hidden aria-hidden="true">
    <span id="veilIc"></span>
    <h2 id="veilHead"></h2>
    <p id="veilLine"></p>
  </div>
</section>
<div class="scrim" id="scrim" hidden><div class="dlg" id="dlg"></div></div>
<!-- THE MENU'S LIST (S1, 2026-10-06), outside .screen so the band's drag region never swallows it;
     ui/app.js paintMenu() fills it and hangs it under #btnMenu. -->
<div class="menu-list" id="menuList" role="menu" aria-label="Menu" tabindex="-1" hidden></div>
<!-- THE ACCOUNT PANEL (board 980), outside .screen for the same reason; ui/app.js paintAcctPop() fills it under #btnAcct while
     a Studio is signed in. It is not modal, and any press elsewhere shuts it. -->
<div class="si-pop" id="acctPop" role="group" hidden></div>
<!-- T3's LIST OF OPEN PROJECTS (2026-10-06), outside .screen for the same reason; paintTabList()
     fills it and hangs it under #btnTabs. -->
<div class="menu-list tab-list" id="tabList" role="menu" aria-labelledby="tabListHead" tabindex="-1" hidden></div>
<!-- AN OBJECT'S MENU (board 901), outside .screen for the same reason; ui/app.js ctxOpen() fills it where the pointer
     is, or under the object for the Menu key and Shift+F10. -->
<div class="menu-list ctx-menu" id="ctxMenu" role="menu" aria-label="Actions" tabindex="-1" hidden></div>
<!-- THE TOUR (board 720). Static, like the discs and the marker's panel, and outside .screen
     because the ring and the panel are placed in viewport coordinates.
     The class stack is the engine's own: `tour-card bub` and `bub`, so the two programs' panels
     are one definition rather than a resemblance - see the spliced region in the sheet above.
     The words are put in by ui/app.js, which is where the tour's steps live; what is here is
     only the shape, so that nothing about the tour is created on the fly. -->
<div id="tourRoot" hidden aria-hidden="true">
  <div class="tour-hole" id="tourHole" aria-hidden="true"></div>
  <div class="tour-card bub" id="tourCard" role="dialog" aria-modal="false"
       aria-labelledby="tourTitle">
    <div class="tour-meta"><span class="tour-step" id="tourStep"></span></div>
    <h3 id="tourTitle"></h3>
    <p id="tourBody"></p>
    <div class="tour-actions">
      <button type="button" class="btn sm tour-skip" id="tourSkip" data-act="tour-skip"></button>
      <button type="button" class="btn sm" id="tourPrev" data-act="tour-prev"></button>
      <button type="button" class="btn sm primary" id="tourNext" data-act="tour-next"></button>
    </div>
  </div>
</div>

<script src="lang.js"></script>
<script src="strength.js"></script>
<script src="opening.js"></script>
<script src="keys.js"></script>
<script src="proxy-ask.js"></script>
