<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:">
<title>Etiuda Studio</title>
<style>
/* THE SHEET IS CLAUDIA'S CANVAS A, variant-a.html of 2026-09-16, which Maxim chose at 16:36.
   Every rule down to the marked line is hers, unchanged, and a change to any of them is a change
   to how the interface looks: it goes to the queue with a picture, never into this file quietly.
   What follows the marked line is this build's own, and each of those rules says why it exists.
   One kind of change was ordered by Maxim's word and made in her rules: no line ends in an
   ellipsis; cut text fades (the rule at .is-cut below the line).

   ONE <style>, NOTHING INJECTS CSS AT RUNTIME, the engine's habit and for the engine's reason:
   a sheet a test can read off the disk is a sheet a test can hold still. */
:root{
  /* Neutrals lifted from the engine's light token block, unchanged. */
  --bg:#f7f8fa; --panel:#ffffff; --ink:#0f172a; --dim:#475569;
  --line:#e4e8ee; --line-strong:#cfd6e0; --field:#fdfdfd; --field-line:#e0e4ea;
  /* The desk's darker foot under a text field. Focus paints over it. */
  --field-edge:#aab3c0;
  --chrome:#f0f2f5;
  /* THE ENGINE'S BUBBLE ASKS THIS PAGE FOR IT and Studio had no such token (board 719, E1).
     A surface lifted off the panel: on a light ground there is nothing above white, so it IS
     the panel and the hairline does the separating, which is exactly what the engine's light
     theme does. Declared here rather than inside the spliced region, because that region is
     the engine's bytes and this is the host page's half of the contract. */
  --panel-raised:var(--panel);
  /* Grey stands in for every accent a dressed build would use, so the eye judges
     the layout. --solid is the primary button, --quiet the secondary. */
  --solid:#334155; --quiet:#e8ecf1;
  /* THE ONLY TWO COLOURS ON THIS CANVAS. --band is Studio's violet, derived from the
     mark set's #7c3aed the way the engine derives #1a4fa0 from #2563eb. --engine is
     the desk's cobalt, and it appears once per screen: beside a folder a desk reads. */
  --band:#5729a6; --band-ink:#fff; --band-ink-rgb:255,255,255;
  --engine:#2563eb;
  /* THE MARKER PEN'S INK (604). A TOKEN OF ITS OWN AND NOT --band: the band is 1.99:1 as ink on
     the dark panel, which a 2px rule cannot live at, so this one steps in dark where the band
     does not - 9.24:1 light and 6.76:1 dark, clearing 3:1 for a rule and 4.5:1 for ink in both
     (Claudia, measured 2026-09-21). The light value IS the band's, and the two are one colour
     by arithmetic rather than by reference, so restepping either leaves the other alone. */
  --mark:#5729a6;
  /* THE FILL OF A CHOSEN PART, the desk's --accent-fill in Studio's violet, a ground for white lettering (9.2:1 here) where
     the dark theme's --mark could not be one. Dark steps to #6d3fc4 (6.7:1), the violet of Studio's dark bubble (Max,
     2026-11-15: "I prefer option B."), so the dark theme has one accent. */
  --mark-fill:#5729a6;
  /* The Library's state dots (the designer, 2026-11-11): as published or all clear, and something waiting. */
  --state-ok:#2e9e6a; --state-look:#d98a1f;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --app-pad:14px; --band-h:40px;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Liberation Sans",sans-serif;
  --sans-display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,"Liberation Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --scroll-thumb:color-mix(in srgb,rgb(71,85,105) 40%,var(--bg));
  --scroll-thumb-hover:color-mix(in srgb,rgb(71,85,105) 65%,var(--bg));
}

*{box-sizing:border-box}
button,a,label,summary,[role=button]{cursor:default}
html,body{margin:0;padding:0}
body{background:#20242c;color:var(--ink);font:15px/1.5 var(--sans)}
/* INTERFACE TEXT DOES NOT SELECT LIKE A PAGE'S (studio-chrome-ui-text-selectable, 2026-10-12): a drag or a double-click
   across rows, headers and status words painted them blue, and Ctrl+A outside a field took the window's text. What a
   person may want to copy still selects: fields, and the paths, identifiers, prints and readings set in the mono face.
   A shortened card id left that class (board 976) and keeps selecting by .id-quiet. A folder chip
   left it too, and keeps selecting by .path-chip. */
body{user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable="true"],[contenteditable=""],.mono,code,pre,kbd,.fp,.pw-path,.fg-path,.vr-tok,.vr-code,.id-quiet,.path-chip,#pressed .path{
  user-select:text;-webkit-user-select:text}

/* ---- One screen = one maximised frameless window filling the shot. The app is
   maximised because that is how it will be used; the shot is the screen. ---- */
section.screen{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg)}

/* ---- THE BAND. 62 per cent Studio violet over the material, no separator line:
   the boundary is two colours meeting. Same construction as the engine's. ---- */
.band{position:relative;z-index:2;height:var(--band-h);flex:0 0 auto;display:flex;
  align-items:stretch;gap:8px;padding-left:var(--app-pad);
  background:color-mix(in srgb,var(--band) 62%,transparent);
  color:var(--band-ink)}
/* Without the material a light page takes the band deeper, 78 per cent over the page's colour, so its white words clear 4.5:1. */
:root:not([data-theme=dark]) body:not(.s-backdrop) .band{background:color-mix(in srgb,var(--band) 78%,var(--bg))}
.brand{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;align-self:center;
  font-family:var(--sans-display);font-weight:350;font-size:19px;line-height:1;
  letter-spacing:.4px;white-space:nowrap;padding-bottom:2px}
.mark{width:25px;height:25px;display:block;flex:0 0 auto}
.band .sep{width:1px;background:rgba(var(--band-ink-rgb),.28);margin:9px 2px;flex:0 0 auto}
.band .quiet{align-self:center;font-size:13px;color:rgba(var(--band-ink-rgb),.72);
  white-space:nowrap;min-width:0;overflow:hidden}
.band .here{align-self:center;font-size:14px;font-weight:600;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
.band .mono,.band .num{color:inherit}
.bbtn{align-self:center;height:26px;min-width:26px;padding:0 8px;border:1px solid rgba(var(--band-ink-rgb),.32);
  border-radius:var(--radius-xs);background:rgba(var(--band-ink-rgb),.12);color:var(--band-ink);
  font:13px var(--sans);display:inline-flex;align-items:center;gap:6px}
.wctl{display:flex;align-self:stretch;flex:0 0 auto}
.wbtn{width:44px;border:0;background:transparent;color:var(--band-ink);font:12px var(--mono);
  display:inline-flex;align-items:center;justify-content:center}
.wbtn.x:hover{background:#c42b1c}
/* THE MAXIMISE BUTTON IS THE DESK'S, its two glyphs copied from the pinned page: the body's s-max,
   pushed by the shell on every change of the window's state, picks one (ui/app.js winMaxSay). */
#winMax .ic{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;
  stroke-linejoin:round}
body:not(.s-max) #winMax .win-g-restore,body.s-max #winMax .win-g-max{display:none}

/* Tabs, variant A only, but the rule lives here because it is the family's. */
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;flex:1 1 auto;padding-top:6px}
.tab{max-width:280px;min-width:0;padding:0 12px;height:34px;border-radius:10px 10px 0 0;
  display:inline-flex;flex-direction:row;align-items:center;gap:8px;font-size:13.5px;
  color:rgba(var(--band-ink-rgb),.88);white-space:nowrap;overflow:hidden}
.tab.on{background:var(--chrome);color:var(--ink);font-weight:600}
.tab .rev{font:12px var(--mono);opacity:.7}
.tab.add{max-width:34px;justify-content:center;padding:0;width:34px}

/* ---- The header chrome, the row below the band, opaque as in the engine. ---- */
.chrome{position:relative;z-index:2;flex:0 0 auto;background:var(--chrome);
  border-bottom:1px solid var(--line);padding:9px var(--app-pad);
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.field{height:32px;border:1px solid var(--field-line);border-bottom-color:var(--line-strong);
  border-radius:var(--radius-sm);background:var(--field);padding:0 10px;display:flex;
  align-items:center;color:var(--dim);font-size:13.5px;min-width:0}
.field.grow{flex:1 1 auto}
/* A CHOICE IS THE DESK'S SEGMENTED CONTROL (the product designer's in-line sheet 04, Max 2026-11-15: "As for 15 choices
   - I agree with all"): a flat track, the chosen part FILLED in the accent and lettered white, the others in dim ink, every
   part semibold so choosing never changes a width. Ported from the engine's .seg; the sizes stay Studio's (4px by 12px is
   the old 2px track padding plus 2px span padding, so no row grows), and the fill moves with the chosen part (segSlide). */
.seg{display:inline-flex;border:1px solid transparent;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--ink) 5%,transparent);padding:0;gap:0;flex:0 0 auto}
.seg span{padding:4px 12px;border-radius:0;font-size:13px;font-weight:600;color:var(--dim)}
.seg span:first-child{border-radius:calc(var(--radius-sm) - 1px) 0 0 calc(var(--radius-sm) - 1px)}
.seg span:last-child{border-radius:0 calc(var(--radius-sm) - 1px) calc(var(--radius-sm) - 1px) 0}
.seg span:only-child{border-radius:calc(var(--radius-sm) - 1px)}
.seg span.on{background:var(--mark-fill);color:#fff}
/* THE TOOLBAR'S SWITCHES KEEP A RAISED FACE, as the desk's own language switch on its tool row does (its "#seg", "the
   language switch on paper"): a choice of what the list shows, standing beside the search, not a setting in force. */
.chrome .seg{border-color:var(--field-line);background:var(--quiet);padding:2px;gap:2px}
.chrome .seg span{padding:2px 10px;border-radius:6px;font-weight:400}
.chrome .seg span.on{background:var(--field);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(15,23,42,.14)}
.btn{height:32px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--panel);color:var(--ink);font:600 13.5px var(--sans);display:inline-flex;
  align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap}
.btn.solid{background:var(--solid);border-color:var(--solid);color:#fff}
.btn.sm{height:27px;padding:0 10px;font-size:12.5px}
.count{font:12px var(--mono);color:var(--dim);background:var(--quiet);border-radius:999px;padding:1px 7px}
.btn.solid .count{background:rgba(255,255,255,.18);color:#fff}

/* ---- The work surface. ---- */
.work{position:relative;z-index:2;flex:1 1 auto;min-height:0;overflow:hidden;display:grid;
  background:var(--bg)}
.pad{padding:16px var(--app-pad)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  min-width:0;overflow:hidden}
.pane>h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
  font:600 13px var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--dim)}
.pane>h3.t{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.pane.scroll{display:flex;flex-direction:column;min-height:0}
.pane.scroll>.sc{overflow:auto;min-height:0}
h1{font:350 26px/1.2 var(--sans-display);margin:0 0 4px}
h2{font:600 17px var(--sans);margin:0 0 3px}
.lede{color:var(--dim);font-size:13.5px;margin:0 0 14px}
/* A catalog's rail is taller than Studio's 560px window, so it scrolls downwards rather than clip its foot (Archive,
   Statistics and Catalog details went under the status bar at every width); sideways it never scrolls. */
.rail{background:var(--chrome);border-right:1px solid var(--line);padding:10px 8px;
  min-width:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--ink);
  text-decoration:none}
.rail a.on{background:var(--panel);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.rail .grp,.sx-nav .grp{font:600 11px var(--sans);letter-spacing:.7px;text-transform:uppercase;
  color:var(--dim);padding:12px 10px 5px}
.num{font:12px var(--mono);color:var(--dim)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:600 11.5px var(--sans);letter-spacing:.6px;text-transform:uppercase;
  color:var(--dim);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
:root[data-density="compact"] td,:root.density-compact td{padding:5px 14px}
:root[data-density="compact"] th,:root.density-compact th{padding:5px 14px}
tr:last-child td{border-bottom:0}
tr.sel td{background:#eef1f6}
.t-title{font-weight:600}
.mono{font:12.5px var(--mono);color:var(--dim);white-space:nowrap}
.ok{color:var(--dim)}
.miss{color:#9aa4b2}
.wide-only{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;
  font:600 11.5px var(--sans);letter-spacing:.3px;border:1px solid var(--line-strong);
  color:var(--dim);background:var(--quiet);white-space:nowrap}
.chip .x{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;
  color:var(--dim);padding:0;margin-left:2px;border-radius:50%}
.chip .x svg{width:12px;height:12px}
.chip .x:hover,.chip .x:focus-visible{color:var(--ink);background:var(--line);outline:none}
.chip.err{background:#e6e8ec;color:#1e2430;border-color:#9aa4b2;font-weight:700}
.chip.warn{background:#f1f2f5;color:#3b4453}
.chip.note{background:transparent}
/* The one place cobalt is allowed: the folder a desk reads. */
.desk{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.desk i{width:9px;height:9px;border-radius:3px;background:var(--engine);flex:0 0 auto}
.box{background:var(--quiet);border-radius:var(--radius-xs);height:11px}
.boxes span{display:block;margin:7px 0}
.arch{display:flex;align-items:flex-end;gap:3px;height:34px}
.arch i{flex:0 1 34px;background:var(--quiet);border-radius:2px}
.arch i.now{background:var(--solid)}
.dashed{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);
  padding:14px;color:var(--dim);font-size:13px;background:#fbfcfd}
/* AN EMPTY SCREEN (board 976, item 8): centred, today's line at 15px, a second line at 13px
   dim, then the one button. The dark rule further down paints every .dashed, and it outranks
   a two-class rule, so the empty shape names the dark ground itself. Errors, refusals and
   "never published" stay the plain .dashed. */
.dashed.empty,:root[data-theme=dark] .dashed.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 24px 42px;text-align:center;
  border:1px dashed var(--line-strong);border-radius:var(--radius);background:color-mix(in srgb,var(--panel) 60%,transparent);
  font-size:15px;color:var(--ink)}
.dashed.empty .empty-ic{width:34px;height:34px;color:var(--mark);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  padding:11px;box-sizing:content-box;border-radius:50%;background:color-mix(in srgb,var(--mark) 10%,transparent)}
.dashed.empty .empty-t::first-letter{text-transform:uppercase}
.dashed.empty .empty-s{font-size:13px;color:var(--dim);max-width:520px;text-wrap:balance}
.dashed.empty .btn{margin-top:4px}

/* Steps, shared by both wizards; each variant places them differently. */
.steps{display:flex;align-items:center;gap:10px;min-width:0}
.step{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);
  white-space:nowrap}
.step b{width:22px;height:22px;border-radius:999px;background:var(--quiet);
  border:1px solid var(--line-strong);display:inline-flex;align-items:center;
  justify-content:center;font:600 12px var(--mono)}
.step.on{color:var(--ink);font-weight:600}
.step.on b{background:var(--solid);border-color:var(--solid);color:#fff}
.step.done b{background:var(--panel)}
.step i{width:26px;height:1px;background:var(--line-strong);display:block}

.foot{flex:0 0 auto;position:relative;z-index:2;background:var(--chrome);
  border-top:1px solid var(--line);padding:11px var(--app-pad);display:flex;
  align-items:center;gap:10px}

/* ---- Covers inside the glass: a dialog is a surface in this window, over a scrim,
   never a second window. ---- */
/* THE SCRIM BLURS WHAT IT DARKENS, as the desk's does (Maxim, 2026-10-07 00:53: "whenever a window is opened that
   darkens the background, the background should also be blured, similarly to Etiuda Desk."). One token, the desk's
   own value (engine src/template.html, --scrim-filter), and its no-blur fallback: where backdrop-filter does not exist
   the cover is the plain tint, as there. The tint below is as it was. The tour darkens nothing (tests/follow-desk.mjs). */
:root{--scrim-filter:blur(4px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--scrim-filter:none}
}
.scrim{position:absolute;inset:0;z-index:5;background:rgba(15,23,42,.42);
  -webkit-backdrop-filter:var(--scrim-filter);backdrop-filter:var(--scrim-filter);
  display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--panel);border-radius:var(--radius);box-shadow:0 18px 48px rgba(0,0,0,.28);
  width:100%;max-width:520px;overflow:hidden;display:flex;flex-direction:column;
  max-height:100%}
.dlg h2{padding:16px 20px 0}
.dlg .lede{padding:0 20px}
/* A lede inside the body stands on the body's own 20 px, so it starts under the heading (the Remove cover's four sentences stood
   20 px right of it; the product designer's sweep, 2026-11-12). */
.dlg .body .lede{padding-left:0;padding-right:0}
.dlg .body{padding:0 20px 4px;overflow:auto}
.dlg .foot{border-top:1px solid var(--line);justify-content:flex-end;
  border-radius:0 0 var(--radius) var(--radius)}
.kv{display:grid;gap:3px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font:600 11.5px var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.kv .v{font-size:14px}
.kv .n{font-size:12.5px;color:var(--dim)}
.ta{border:1px solid var(--field-line);border-bottom-color:var(--line-strong);
  border-radius:var(--radius-sm);background:var(--field);padding:9px 11px;color:var(--dim);
  font-size:13.5px;min-height:62px}
.row2{display:flex;align-items:center;gap:8px}
.cbx{width:15px;height:15px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--field);flex:0 0 auto}
.cbx.on{background:var(--solid);border-color:var(--solid)}
/* A TICK'S WHOLE ROW IS THE CONTROL (desktop polish, 2026-10-12): the name beside the box toggles it, and the row
   says so by the same wash a button takes on hover and on press. There is no pointer: Maxim's rule in the engine's
   rulebook, "The cursor stays the arrow" (2026-08-31), holds here as everywhere, so the wash is the row's only sign. A tick in a table has no label. */
label.row2:has(>.cbx), .pw-tickrow:has(>.cbx){
  border-radius:6px;padding:2px 8px 2px 2px;margin-left:-2px}
label.row2:has(>.cbx):hover, .pw-tickrow:has(>.cbx):hover{
  background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
label.row2:has(>.cbx):active, .pw-tickrow:has(>.cbx):active{
  background:color-mix(in srgb,var(--ink) 12%,var(--panel))}

/* ---- Widths. The base is the stacked layout nobody will see; every grid is declared
   inside a min-width query so 1280 is a decision and not a leftover. ---- */
/* ---- THE FILE ITSELF, DRAWN BESIDE THE READING (642, variant B). ----
   Maxim ruled B on 2026-09-21 12:26 for a table and for a column alike: the top of the person's
   own file goes beside the reading so the guess is checkable rather than trusted. Everything
   here is the canvas's own - a pane, a table, a kv - except the two shapes below, which are the
   file's cells and have no counterpart on it.

   THE ROLE OF A POSITION IS A LABEL AND NOT A COLOUR. Claudia's frames tint each position of a
   cycle by the field it was given; this canvas has no hue for anything but the band and the
   desk's cobalt, and a first hue is Maxim's eye, as it was for the warnings of 579. The edge is
   --line-strong, which is the only weight this sheet already spends on grouping.

   A colstack is the right-hand column of .cols when it holds two panes rather than one: the
   grid's own gap, and align-content start so a short pane does not stretch to the tall one's
   height. */
.colstack{display:grid;gap:14px;align-content:start;min-width:0}
/* And the file's own pane does not stretch to the height of the column beside it: a spreadsheet
   of three rows drawn as tall as a mapping table of nine leaves a hand's width of empty panel
   under the last cell, which reads as content that failed to arrive. */
.cols>.filepane{align-self:start}
/* THE TOP OF A SPREADSHEET READS ACROSS AND NOT DOWN. A cell of a hundred characters in a
   column of nine wraps into a tower and the two rows under the heading become half a screen,
   which is a picture of nothing: what a person checks here is the HEADING ROW against the first
   values under it. So a cell is one line, cut at the column's own width, and the table overflows
   sideways inside its pane rather than growing downwards. */
table.cyc{width:max-content}
table.cyc td{vertical-align:top;font-size:13px}
table.cyc td>span{display:block;max-width:190px;overflow:hidden;
  white-space:nowrap}
td.cyc-n{color:#9aa4b2;width:1%;white-space:nowrap;text-align:right}
.cyc-r{display:grid;grid-template-columns:22px 1fr;gap:0 8px;align-items:start;
  padding:10px 0;border-top:1px solid var(--line)}
.cyc-r:first-of-type{border-top:0}
span.cyc-n{color:#9aa4b2;font-size:12px;padding-top:2px}
.cyc-c{display:grid;gap:2px;min-width:0}
.cyc-k{font:600 10px var(--sans);letter-spacing:.7px;text-transform:uppercase;color:#9aa4b2}
.cyc-v{font-size:13.5px;overflow-wrap:anywhere;border-left:2px solid var(--line-strong);
  padding:1px 0 5px 9px;margin-bottom:3px}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1100px){
  .cols{grid-template-columns:1fr 1fr}
  .cols.three{grid-template-columns:1fr 1fr}
}
@media (min-width:1600px){
  .cols.three{grid-template-columns:1fr 1fr 1fr}
  .wide-only{display:table-cell}
  th.wide-only{display:table-cell}
}

/* VARIANT A: projects are tabs in the band, sections are a rail, tasks are pages. THE RAIL STAYS ON THE LEFT AT EVERY
   WIDTH Studio allows (Max, 2026-11-14: "left side panel should stay as left side panel"); below 1100 it had stacked
   over the page as a band. tests/rail-left.mjs holds every screen's panel beside its content from MIN_W up. */
.va .work{grid-template-columns:232px minmax(0,1fr)} /* plant:rail-left */
@media (min-width:1600px){ .va .work{grid-template-columns:264px minmax(0,1fr)} }
.va .main{min-width:0;overflow:auto;background:var(--bg)}

/* ============ END OF THE CANVAS. Everything below is this build's own. ============ */
/* The mark's two masks, standing and turning, in an svg of their own that is always rendered: Chromium paints no mask that sits
   in an svg with display:none, and the band's mark and every copy of it reach these by id. */
.mark-masks{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none}

/* CUT TEXT FADES, IT DOES NOT END IN DOTS (Maxim, 2026-10-06 22:20: "All text must shorten with
   fade off, as it does in Desk"). The desk's mask, decided per side by the desk's pass: cutPass()
   in ui/app.js reads where a line's ink lands against its box. An ellipsis typed into a word, a
   menu row that opens a dialog or a state in progress, is a word and is untouched. */
.is-cut{-webkit-mask-image:linear-gradient(to right,transparent,#000 var(--cut-l,0px),
                     #000 calc(100% - var(--cut-r,0px)),transparent);
  mask-image:linear-gradient(to right,transparent,#000 var(--cut-l,0px),
             #000 calc(100% - var(--cut-r,0px)),transparent)}
.is-cut.cut-l{--cut-l:1.5em}
.is-cut.cut-r{--cut-r:1.5em}
/* A box of more than one line that runs out of lines fades the end of its last line. */
.cut-b{-webkit-mask-image:linear-gradient(#000,#000),linear-gradient(to right,#000 calc(100% - 3em),transparent);
  -webkit-mask-size:100% calc(100% - 1lh),100% 1lh;-webkit-mask-position:0 0,0 100%;-webkit-mask-repeat:no-repeat;
  mask-image:linear-gradient(#000,#000),linear-gradient(to right,#000 calc(100% - 3em),transparent);
  mask-size:100% calc(100% - 1lh),100% 1lh;mask-position:0 0,0 100%;mask-repeat:no-repeat}
/* WORDING ITS OWN CODE CUT SHORT (a diff's window, a find's context, a quoted clause, a file's cell)
   fades over its last or first three characters, wherever on the line that end lands: a box edge
   would fade nothing when the cut ends mid-line. cutHtml() in ui/app.js writes them. */
.fo-l,.fo-r{white-space:nowrap}
.fo-l{-webkit-mask-image:linear-gradient(to right,transparent,#000);mask-image:linear-gradient(to right,transparent,#000)}
.fo-r{-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent)}

/* ---- THE MENU'S LIST, THE ABOUT AND THE STATUS BAR (Maxim, 2026-10-06 21:13: S1, S2 at S3's size,
   F3). Claudia's sheet of that day (2026-10-06): frames
   studio-s1-menu, studio-s2-about, studio-s3-about-licence for the width and studio-f3-status. Her
   rules, landed with this page's own tokens; the one colour she added is the saved dot's green. */
.menu-list{position:fixed;z-index:9;min-width:230px;padding:4px;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);box-shadow:0 12px 32px rgba(0,0,0,.24);
  font-size:13.5px;display:flex;flex-direction:column}
.menu-list .mi{display:flex;align-items:center;gap:9px;padding:4px 10px;line-height:20px;border:0;border-radius:6px;
  background:transparent;color:var(--ink);font:inherit;text-align:left}
/* ONE ROW MARKED AT A TIME: the mark is the focus alone, and the pointer moving over a row hands it the focus (ui/app.js,
   THE LIST'S POINTER), so the pointer and the keys share one mark. A :hover mark here would be a second one. */
.menu-list:focus{outline:none}
.menu-list .mi:focus{background:var(--quiet);outline:none}
.menu-list .mi .ic{width:16px;height:16px;color:var(--dim);flex:0 0 auto}
.menu-list .mi small{margin-left:auto;padding-left:14px;font:11.5px var(--mono);color:var(--dim)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:3px 2px}
#btnMenu[aria-expanded="true"]{background:rgba(var(--band-ink-rgb),.22)}
/* AN OBJECT'S MENU (board 901) is the same list, hung at the pointer or under the object rather than under a button; a
   row with no glyph keeps the glyph's room so the words line up, and the key that does the same sits at the right. */
.ctx-menu{min-width:220px;outline:none}
.ctx-menu .mi span:not(.ic){white-space:nowrap}
.ctx-menu .mi span.ic{display:inline-block}
.ctx-menu .mi small{font:11.5px var(--sans)}
/* A NAME RENAMED IN PLACE: the field takes the name's own room, on a row, a tab, a tile or a node. */
input.field.naming{height:28px;padding:0 7px;font-weight:inherit}
.tab input.field.naming{height:24px;width:auto;min-width:96px;max-width:200px;font-size:13px}
.tile-t input.field.naming,.pm-node input.field.naming{height:26px;font-size:13.5px}
#main .projects .pn{display:inline-block;max-width:100%;overflow:hidden;white-space:nowrap;vertical-align:bottom}
#main .projects tr[data-ctx]{cursor:default}
/* THE ABOUT IS S2's ROWS AT S3's WIDTH: Maxim kept the window the size S3 drew it, 620 wide where a
   cover is 520. Its agreement page is the same cover and keeps the width. */
#dlg:has(.ab-h){max-width:620px}
.dlg h2.ab-h{display:flex;align-items:center;gap:10px;font:350 26px var(--sans-display);letter-spacing:.4px;
  padding:18px 20px 4px;margin:0}
.dlg h2.ab-h svg{width:30px;height:30px;color:var(--mark);flex:0 0 auto;position:relative;top:1px}
.dlg h2.ab-lic-h{font-size:20px}
.kv.ab-kv{grid-template-columns:150px minmax(0,1fr) auto;align-items:start;column-gap:14px}
.kv.ab-kv .k{padding-top:3px}
.kv.ab-kv .ab-v{display:grid;gap:2px}
.kv.ab-kv .btn{align-self:center}
.dlg .foot .ab-cr{font-size:12.5px;color:var(--dim)}
.dlg .foot .ab-cr a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.dlg .ab-legal p{margin:0 0 10px;font-size:13.5px}
.dlg .ab-legal p:first-child{margin-top:8px}
/* F3: the window's last strip, under the work area and any bar above it; the corner discs stand
   their 22px clear of it rather than of the window's edge. */
.sbar{flex:0 0 auto;height:26px;display:flex;align-items:center;gap:14px;padding:0 var(--app-pad);
  background:var(--chrome);border-top:1px solid var(--line);font-size:12px;color:var(--dim);
  position:relative;z-index:2;white-space:nowrap;overflow:hidden}
.sbar .sp{flex:1 1 auto}
.sbar .sb-l{display:flex;align-items:center;gap:14px;min-width:0;overflow:hidden}
.sbar .sb-dir{overflow:hidden;white-space:nowrap;min-width:0}
.sbar i{font-style:normal;color:var(--ink)}
.sbar .chip{margin-left:8px}
.sbar .btn.sm{height:20px;padding:0 8px;font-size:11.5px}
.t-title .chip,.cap .nm .chip{margin-left:8px}
.sbar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px;
  background:#16a34a}
/* On its way, the dot dims; held or refused, it is an empty ring, which asks for a look without a red. */
.sbar .dot.saving{background:var(--line-strong)}
.sbar .dot.held,.sbar .dot.refused{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.sbar .sb-st[data-state="held"],.sbar .sb-st[data-state="refused"]{color:var(--ink)}
.sbar .sb-r{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.sbar svg{width:14px;height:14px;color:var(--mark);flex:0 0 auto}
.sbar a{color:inherit;text-decoration:underline;text-underline-offset:3px}
#discs{bottom:calc(22px + 26px)}
/* THE UPDATE OFFER (board 991; the product designer's ruling of 2026-11-11 17:35): Overview's strip, one line across the page
   above the number cards, in the look of the Library card's strip (button.lw-rc.more under the cards) on a solid accent-soft
   ground, the selected section's tint; and the status bar's quiet accent mark beside the version, an ordinary button. */
.up-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 14px;margin:0 0 14px;border:1px solid var(--sx-sel-ring);
  border-radius:var(--radius);background:var(--sx-sel-bg);font-size:13.5px}
/* The words are never cut: where the window is too narrow for one line, the two buttons go under them. */
.up-strip b{font:600 14px var(--sans);color:var(--mark)}
.up-strip .sp{flex:1 1 auto}
.sbar .sb-up{height:auto;border:0;background:transparent;padding:0 0 0 4px;font:inherit;color:var(--mark)}
.sbar .sb-up:hover{text-decoration:underline;text-underline-offset:3px}

/* .miss CLEARS 4.5:1 ON A SELECTED ROW IN BOTH THEMES AND STAYS QUIETER THAN --dim: the canvas's
   #9aa4b2 is 2.52:1 on white, and louder than --dim on the dark panel. */
:root{--miss:#646e7e}
.miss{color:var(--miss)}
/* A date or a count that must not break across a line (ui/app.js unbroken). */
.nw{white-space:nowrap}
/* Read by a screen reader and drawn nowhere: #said, the status line (ui/app.js announce). */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap}
/* The canvas's tick, its light colour unchanged; the dark block sets --tick. */
.cbx.on{background:var(--tick,var(--solid));border-color:var(--tick,var(--solid))}

/* ONE RULE FOR `hidden`, FIRST BELOW THE LINE BECAUSE EVERY SCREEN DEPENDS ON IT. The user
   agent's own `[hidden]{display:none}` has the specificity of a bare attribute selector, so any
   author rule declaring a display beats it - and the canvas declares a display on nearly
   everything, because a still picture has every cover up. So `el.hidden = true` did NOTHING on
   this page, silently, element by element.

   IT WAS FOUND THREE TIMES BEFORE IT WAS FIXED ONCE, and the three findings are why the rule is
   general rather than a fourth exception. .scrim, measured 2026-09-17: the light ground read
   (150,153,163) where the token says #f7f8fa, exactly 0.58 of #f7f8fa plus 0.42 of rgba(15,23,42)
   on all three channels - a cover that was never up dimming every screen, and it looked plausible,
   which is how it survived being looked at. .foot the same way, a 45px strip of chrome under every
   screen. .chrome the same way, 51px with a hairline under it. Each got a rule of its own; the
   answer was right three times and wrong as a habit, because the fourth element to carry `hidden`
   would be broken on the morning it was written by an author who had read three rules saying this
   was handled. Claudia measured that fourth one before it existed - a tour's Back button, `.btn`
   declaring a display, painting 49x27 with the attribute set (board 721).

   `!important` IS WHAT MAKES IT GENERAL: without it the rule loses to `.scrim{display:flex}` on
   specificity and buys nothing. The engine reached the same rule for the same reason and writes it
   the same way, src/template.html:691. An element that must be laid out while carrying `hidden`
   is a contradiction in terms; use a class. tests/hidden.mjs holds this to both halves - that the
   rule bites on an element with a display of its own, and that removing it puts that element back
   on the screen. */
[hidden]{display:none!important}

/* THE CARET ONLY WHERE TYPING HAPPENS (Maxim's rule for Studio, as the desk's): `cursor:auto`
   draws an I-beam over any run of text, so the arrow is declared once on html and inherited by
   every surface, and a field that takes typing is the one exception. tests/cursor.mjs. */
html{cursor:default}
input,textarea,[contenteditable="true"],[contenteditable=""]{cursor:text}
input[type=checkbox],input[type=radio],input[type=range],input[type=file],input[type=color],
input[readonly],input:disabled,textarea[readonly],textarea:disabled,select{cursor:default}

/* THE MATERIAL, which is the one thing a grey-box canvas could not have. The canvas painted a
   blurred desktop into a .wall element because a file in a browser has no host; here Acrylic is
   composited BEHIND the window by the compositor and shows only where the window leaves pixels
   unpainted. So the wall is gone, the body paints nothing under a backdrop, and the band's strip
   is the one place nothing opaque is drawn - which is what makes the canvas's own 62 per cent
   scrim a scrim rather than a flat violet. Without a host (a browser, a Windows 10 desk) the
   body keeps its colour and the band is simply solid, which is the engine's arrangement too. */
body.s-backdrop{background:transparent}
body.s-backdrop section.screen{background:transparent}
body.s-backdrop .work,body.s-backdrop .va .main{background:var(--bg)}
/* A DIALOG'S SCRIM CANNOT REACH WHAT THE PAGE NEVER PAINTED: the scrim is drawn by the page and
   the material is composited behind the window, so whatever share of a band pixel the tint
   leaves uncovered arrives sharp however heavy the scrim. The floor goes back under the whole
   window while a cover is up, the band's own tint above it unchanged. */
body.s-backdrop:has(.scrim:not([hidden]):not(.bubbled)){background:var(--bg)}

/* .scrim, .foot and .chrome each carried a `[hidden]` rule of their own here until board 721.
   The one rule at the head of this half replaced all three; their reasoning is in its comment,
   because the measurements are what argue for the general form. */

/* THE BAND IS THE DRAG REGION, and a draggable region swallows every pointer event over its
   rectangle, so each thing inside it that answers a click says no-drag. */
body.s-host .band{app-region:drag;-webkit-app-region:drag;user-select:none}
body.s-host .band button,body.s-host .band .tab,body.s-host .band input{
  app-region:no-drag;-webkit-app-region:no-drag}

/* ---- THE TAB STRIP WHEN THE BAND RUNS OUT OF ROOM (T3, Maxim 2026-10-06 22:20: "We go with T3").
   Claudia's frames tb-b-* and tb-c-900 (her sheet of 2026-10-06);
   the widths are fitTabs()'s in ui/app.js. The tabs take the band's whole free width, so the
   spacer takes none; Projects, the arrows, + and the list button keep theirs and the strip of
   project tabs gives way, scrolling between the desk's two arrows when it must. ---- */
.band>.spacer{flex:0 0 0}
.tabs>.tab{flex:0 0 auto}
.tabs-bar{display:flex;align-items:flex-end;gap:2px;flex:0 1 auto;min-width:0;align-self:stretch;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs-bar::-webkit-scrollbar{display:none}
.tabs-bar .tab{flex:0 0 auto;max-width:none}
.tabs-nav{display:none;flex:0 0 auto;align-self:flex-end;width:20px;height:34px;margin:0;padding:0;border:0;
  border-radius:4px;background:transparent;color:rgba(var(--band-ink-rgb),.88);align-items:center;justify-content:center}
.tabs.tabs-over .tabs-nav{display:inline-flex}
.tabs-nav:hover:not(:disabled),.tabs-nav:focus-visible:not(:disabled){background:rgba(var(--band-ink-rgb),.14)}
/* Disabled dims the mark, as on the desk: the arrows also say where the strip is parked. */
.tabs-nav:disabled .ic{opacity:.35}
.brand.folded .word{display:none}
#btnTabs{flex:0 0 auto;margin-left:6px}
#btnTabs[aria-expanded="true"]{background:rgba(var(--band-ink-rgb),.22)}
.tab-list{min-width:280px;max-width:min(440px,calc(100vw - 16px))}
.tab-list .tl-h{padding:6px 10px 5px;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tab-list .nm{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.tab-list .mi .rev{font:12px var(--mono);color:var(--dim);flex:0 0 auto;margin-left:14px}
.tab-list .mi.on{background:color-mix(in srgb,var(--mark) 10%,transparent);font-weight:600}
.tab-list .mi .x{flex:0 0 auto;display:inline-flex;padding:2px;border-radius:4px;color:var(--dim)}
.tab-list .mi .x:hover,.tab-list .mi .x:focus-visible{color:#c44;background:rgba(196,68,68,.14)}

/* THE KEYBOARD MUST SEE WHAT THE MOUSE SEES. The canvas is a still picture and carries no
   interactive states at all; leaving it at that would ship an app no one can drive from the
   keyboard, which is restoring a promise rather than changing one. Hover and :focus-visible are
   named together in every rule here, the engine's habit since its item 452, so a new hover
   treatment cannot be added without its twin. */
:focus{outline:none}
.btn:hover,.btn:focus-visible{background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
.btn.solid:hover,.btn.solid:focus-visible{background:color-mix(in srgb,#fff 12%,var(--solid))}
.bbtn:hover,.bbtn:focus-visible{background:rgba(var(--band-ink-rgb),.24)}
.wbtn:hover,.wbtn:focus-visible{background:rgba(var(--band-ink-rgb),.16)}
.wbtn.x:hover,.wbtn.x:focus-visible{background:#c42b1c}
.rail a:hover,.rail a:focus-visible{background:color-mix(in srgb,var(--ink) 5%,var(--chrome))}
.rail a.on:hover,.rail a.on:focus-visible{background:var(--panel)}
/* The desk's: an unchosen part under the pointer takes the accent in its lettering, and the chosen one keeps its face. */
.seg span:not(.on):hover,.seg span:not(.on):focus-visible{color:var(--mark)}
.chrome .seg span:not(.on):hover,.chrome .seg span:not(.on):focus-visible{color:var(--ink)}
.tab:hover,.tab:focus-visible{background:rgba(var(--band-ink-rgb),.14)}
.tab.on:hover,.tab.on:focus-visible{background:var(--chrome)}
/* A PROJECT TAB'S CROSS, the desk's .tab-x in this sheet's names: band ink at rest, the selected
   tab's dim, a red chip under the hand or the keyboard. A long name gives way before rev and cross. */
.tab .nm{min-width:0;overflow:hidden;white-space:nowrap}
.tab .rev{flex:0 0 auto}
.tab .x{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:2px;
  margin-right:-6px;border-radius:4px;color:rgba(var(--band-ink-rgb),.7);opacity:.75}
.tab.on .x{color:var(--dim);opacity:.85}
.tab:hover .x,.tab:focus-visible .x{opacity:1}
.tab .x:hover,.tab .x:focus-visible{color:#c44;background:rgba(196,68,68,.14);opacity:1}
/* "+" BUILT AS THE CROSS IS, the desk's .tab-add-mark (board 982, finding 17): the same 20 px chip round the same
   16 px drawing, so the + and every cross centre on one line, and under the hand the chip lights rather than a
   tab-shaped face, since the + is a button and not a tab. Not .mark, which is the band's own logo (25 px). */
.tab.add{color:rgba(var(--band-ink-rgb),.7)}
.tab.add .plus{display:inline-flex;align-items:center;justify-content:center;padding:2px;border-radius:4px}
.tab.add:hover,.tab.add:focus-visible{background:transparent;color:var(--band-ink)}
.tab.add:hover .plus,.tab.add:focus-visible .plus{background:rgba(var(--band-ink-rgb),.14)}
/* The tab a drag carries (board 982, finding 16), as the desk's .tab.dragging. */
.tab.dragging{opacity:.55;position:relative;z-index:3}
tbody tr.pick:hover td{background:color-mix(in srgb,var(--ink) 3%,var(--panel))}
tbody tr.pick.sel:hover td{background:#eef1f6}
/* The dark theme's selected row keeps its own look under the pointer: this rule's weight beats the plain dark one (board 1019 (8)). */
:root[data-theme=dark] tbody tr.pick.sel:hover td{background:#1b1f27}
/* --mark and not --band: the band is 1.99:1 on the dark panel and unstepped there. */
*:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
body.s-backdrop .band *:focus-visible{outline-color:var(--band-ink)}

/* THE GLYPHS. One size for everything, two smaller ones where the control itself is smaller,
   and nothing else: the set is drawn on a 24 grid with a 1.75 stroke, which reads as a hairline
   at 16px beside 13.5px text and is the weight the canvas's own hairlines have. NO COLOUR IS
   NAMED HERE: every glyph is drawn in currentColor, so it takes the ink of the control it sits
   in and turns with the theme without a token of its own. */
.ic{width:16px;height:16px;flex:0 0 auto;display:block}
.btn.sm .ic{width:14px;height:14px}
/* A RAIL ROW'S GLYPH AND NAME TRAVEL TOGETHER, so the count stays at the far end: the row is a
   flex with its two ends pushed apart, and the name is the end that may be cut. */
.rail a .rl{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden;
  white-space:nowrap}

/* THE FIELDS. The canvas draws .field and .ta as grey boxes holding a label, because a picture
   of a text box and a text box look the same standing still. These make them real without
   moving a pixel: the same border, radius, background and metrics, ink at full strength once
   something is typed, and the placeholder at the canvas's --dim, which is exactly what the
   grey box was showing. */
input.field,textarea.ta,select.field{font:13.5px var(--sans);color:var(--ink);width:100%}
input.field,select.field{height:32px;display:block}
textarea.ta{resize:vertical;line-height:1.5;font-family:var(--sans);width:100%;display:block}
input.field::placeholder,textarea.ta::placeholder{color:var(--dim);opacity:1}
/* Quick facts, empty (board 976, item 8): the hint is dimmer than a field's own placeholder,
   and it keeps the field's face. */
textarea.ta[data-facts]::placeholder{color:color-mix(in srgb,var(--dim) 75%,transparent);font:inherit}
select.field:focus{border-bottom-color:var(--band)}
select.field{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                   linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ta.tall{min-height:132px}
label.row2{cursor:default}
/* A CONTROL'S EDGE IS AT LEAST 3:1 AGAINST WHAT IT SITS ON (WCAG 1.4.11, polish 02 fault 10): the canvas's --field-line was
   1.28:1 on the light pane and 1.58:1 on the dark one, and a field's ground is within a shade of the pane's, so the edge is all
   that says a box is there. Measured against --bg, --panel and --chrome, the three grounds a field sits on (tests/cards-reapplied.mjs
   cra4). A ticked .cbx keeps its own (.cbx.on is the more specific rule), and a focused field keeps its violet foot. */
:root{--edge:#838c9a}
:root[data-theme=dark]{--edge:#646c78}
input.field,select.field,textarea.ta,.cbx,.vr-write[contenteditable="true"]{border-color:var(--edge)}
/* THE DESK'S WINUI TEXT BOX (.fill .field-wrap): a darker foot inset at rest, and on focus a
   2px foot of --mark and no ring. --mark, not --band: a 2px rule cannot live at the band on
   the dark panel. The desk states no hover and no disabled dress, so those keep the rest foot. */
input.code{height:32px;border:1px solid var(--edge);border-radius:var(--radius-sm);
  background:var(--field);padding:0 10px}
input.field,textarea.ta,input.code,.vr-write[contenteditable="true"]{
  box-shadow:inset 0 -1px 0 0 var(--field-edge);outline:none}
input.field:focus,textarea.ta:focus,input.code:focus,.vr-write[contenteditable="true"]:focus,
input.field:focus-visible,textarea.ta:focus-visible,input.code:focus-visible,
.vr-write[contenteditable="true"]:focus-visible{
  outline:none;box-shadow:inset 0 -2px 0 0 var(--mark)}
/* A LIST EDITED IN PLACE (board 976, item 10). A name reads as text at rest: no border, no
   ground, weight 600. The border and the ground return under the pointer and on focus.
   The border is --edge, the 3:1 edge this sheet already uses, where the drawing named
   --field-line. Focus puts the desk's 2px foot back, and it is written after the hover
   rule so the two, at the same weight, let focus win: a rest rule of box-shadow none
   would otherwise outrank the field's own focus foot. The three buttons stay in the row
   at opacity 0, so Tab still reaches them, and the row reveals them under the pointer
   or when focus is inside it. */
tr[data-ctx=tag] td .field{border-color:transparent;background:transparent;box-shadow:none;font-weight:600;padding-left:8px}
tr[data-ctx=tag]:hover td .field{border-color:var(--edge);background:var(--field);box-shadow:inset 0 -1px 0 0 var(--field-edge)}
tr[data-ctx=tag] td .field:focus,tr[data-ctx=tag] td .field:focus-visible{border-color:var(--edge);background:var(--field);outline:none;box-shadow:inset 0 -2px 0 0 var(--mark)}
tr[data-ctx=tag] .row2 .btn.sm{border-color:transparent;background:transparent;color:var(--dim);opacity:0;transition:opacity .15s ease}
tr[data-ctx=tag]:hover .row2 .btn.sm,tr[data-ctx=tag]:focus-within .row2 .btn.sm{opacity:1}
tr[data-ctx=tag] .row2 .btn.sm:hover{border-color:var(--line-strong);background:var(--panel);color:var(--ink)}
tr[data-ctx=tag] td{padding-top:5px;padding-bottom:5px}
/* THE PANE THAT HOLDS THE CARDS TABLE SCROLLS SIDEWAYS (polish 02, fault 8): in Polish with a card open the table is wider than its
   half of the row, and .pane clips, so the last column was cut with no way to reach it. */
.cols>.pane:has(>table){overflow-x:auto}

/* The card's fields sit in the canvas's own two-pane .cols, which its import wizard already
   uses for a pair of panes side by side; these two rules only give that pane's inside the same
   14px the canvas gives a table cell, so the .kv rows it holds line up with everything else. */
.pane>.sc{padding:0 14px 6px}
/* THE CARD EDITOR STAYS IN PLACE WHILE THE TABLE SCROLLS, from the width where the two sit side by side
   (the table scrolls in #main, so an unpinned editor left with the first rows). Below 1100 the editor is
   under the table and nothing is pinned. Its own fields scroll inside it, so a tall card (three languages,
   history, tags) is reachable: the cap is the window less what is always around #main, the band (40), the
   chrome row (51), the pad's two 16s, and a bar at the foot (47), 176 in all, a number an eye may reset.
   `top` is the pad's own 16. The tests read this rule's shape (tests/editor-sticky.mjs); what the eye sees is
   Maxim's. */
@media (min-width:1100px){
  .cols>#cardEditor{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;
    max-height:calc(100vh - 176px)}
  .cols>#cardEditor>.sc{overflow:auto;min-height:0}
}
/* THE CARD'S ACTS SIT IN THE EDITOR (desktop polish, 2026-10-12), under the heading and above the fields, so a long
   card does not leave Duplicate, Retire and Delete off the screen. This wins over .row2.acts's corner padding, which
   belonged to the row when it shared the table's foot with the discs. */
#cardEditor>.ed-acts{flex:0 0 auto;flex-wrap:wrap;padding:2px 14px 8px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* DARK. The canvas is a light still and carries no dark block; these neutrals are lifted from
   the engine's own dark token block unchanged, exactly as the canvas lifted the light ones, so
   the two programs are one family in both themes rather than two designs. The two colours the
   canvas names - the band violet and the desk cobalt - are NOT restepped here: they are solved
   for both grounds already, the way the engine's category palette is. */
:root{color-scheme:light}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f1013; --panel:#131418; --ink:#e3e6ea; --dim:#8f98a6;
  --line:#262a31; --line-strong:#39404a; --field:#23262c; --field-line:#343941;
  --field-edge:rgba(255,255,255,.30);
  --chrome:#191b20;
  --solid:#3b4a5f; --quiet:#20242b;
  --mark:#a78bfa;
  --mark-fill:#6d3fc4;
  --state-ok:#4cc38a; --state-look:#e5a443;
  /* A TICKED .cbx IS FILLED WITH INK IN THE DARK (sense pass item 28): --solid there is a quiet
     button ground at 1.68:1 on --field, where the canvas's light tick stands at 10.18:1. */
  --tick:var(--ink);
  --miss:#7f8896;
  /* THE HOST PAGE'S HALF OF THE BUBBLE'S CONTRACT, dark. A raised surface LIFTS on a dark
     ground, where on a light one it cannot; the step is the engine's own between --panel and
     its raised value. And --bub-shadow is the one of the family's four tokens a theme has ever
     moved: cobalt at 32 per cent glows on a light page and smears on a dark one, so the dark
     themes take black at 55, which is the value the engine's own dark blocks carry. */
  --panel-raised:#191b20;
  --win-raised:#1d1f24;
  --rim-foot:.2;
  --rim:radial-gradient(520px 36px at 0 0,rgba(255,255,255,.2),rgba(255,255,255,.08) 40%,transparent 85%),radial-gradient(520px 36px at 100% 100%,rgba(255,255,255,calc(.2 * var(--rim-foot))),rgba(255,255,255,calc(.08 * var(--rim-foot))) 40%,transparent 85%),linear-gradient(rgba(255,255,255,.18),transparent 12px calc(100% - 12px),rgba(255,255,255,calc(.18 * var(--rim-foot)))),linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.02));
  --bub-shadow:rgba(0,0,0,.55);
  --scroll-thumb:color-mix(in srgb,rgb(152,162,179) 40%,var(--bg));
  --scroll-thumb-hover:color-mix(in srgb,rgb(152,162,179) 75%,var(--bg));
}
:root[data-theme=dark] tr.sel td{background:#1b1f27}
/* A cover on a light ground is white on near-white and its shadow draws the edge; on a dark
   ground the shadow has nothing to darken, so the panel needs the hairline every other surface
   in this build already has. Measured, not guessed: the cover's face is #131418 against a
   #0f1013 canvas, four values apart. */
:root[data-theme=dark] .dlg{border:1px solid var(--line)}
:root[data-theme=dark] .chip.err{background:#2a2f38;color:#e3e6ea;border-color:#5b6470}
:root[data-theme=dark] .chip.warn{background:#22262e;color:#c3cad4}
:root[data-theme=dark] .dashed{background:#15171c}
:root[data-theme=dark] .rail a.on,:root[data-theme=dark] .sx-nav a.on{box-shadow:0 1px 2px rgba(0,0,0,.5)}
:root[data-theme=dark] .chrome .seg span.on{box-shadow:0 1px 2px rgba(0,0,0,.5)}

/* Selected text carries Studio's accent (--mark) rather than the browser default. */
::selection{background:color-mix(in srgb,var(--mark) 30%,transparent)} /* plant:scrollbars-selection */
/* App-wide thin scrollbars, from the desk's template (src/template.html). */
*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent} /* plant:scrollbars-thin */
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background-color:var(--scroll-thumb);border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background-color:var(--scroll-thumb-hover)}
*::-webkit-scrollbar-corner{background:transparent}

/* THE SECOND HALF OF A DIFF LINE MUST BE READABLE. Every other line of monospace this program
   paints is a path, an id or an edition, and a cell that will not wrap is right for those; a
   diff line carries the WORDS ON BOTH SIDES of a change and is as long as they are. Measured in
   the window on 2026-09-17, one changed Polish body of 150 characters: the cell wants 1104px and
   its right edge lands at x=1351 in a 1299px window, so 52px of it - the end of the new
   wording, which is the half a reviewer opened the screen for - is off the screen with no
   scrollbar to reach it. Wrapped it is 1038px over two lines, 35px tall becoming 49px. This is
   the only place in Studio that paints a line of arbitrary length. */
#main td.diff{white-space:pre-wrap;word-break:break-word}
/* A PATH IN A COVER WRAPS, and this is the same fault as the line above in a different room. A
   cover's body is 518px wide and does not grow; the file a person picked for an upgrade is shown
   under its name, and a 145-character path wants 1062px, so its right edge landed at x=1472
   against a body ending at x=909 - 563px of it off the cover, the body's scrollWidth 1082 against
   a clientWidth of 518, and a horizontal scrollbar under the whole dialog that cut the buttons
   off from the rows. Measured 2026-09-17. `anywhere` rather than break-word because a Windows
   path has no spaces to break at and break-word leaves the first unbreakable run overflowing,
   and `white-space` because the canvas's own .mono is nowrap for the folder in a table row,
   which is the right answer in a cell and the wrong one in a dialog that cannot widen. */
#dlg .kv .mono{white-space:normal;overflow-wrap:anywhere}
/* A CELL WITH NO BOUND ON ITS LENGTH PUSHES THE LAST COLUMN OFF THE PANE, with no scrollbar to
   reach it: the desks' period carries "declared, not computed", which board 461 makes
   load-bearing, and the team's intents cell grows with the catalog. So the cells wrap, and only
   a column that is one unbroken token (a desk id, the intents list) breaks mid-word: break-all
   everywhere chopped "share-catalog", "en=4 pl=2" and the sync stamp where a space would do. */
#main table.desks td,
#main table.team td{white-space:normal;word-break:normal}
#main table.team td:nth-child(2){word-break:break-all}
/* The desks' first column is a teammate's name now, never an id (the key has its own column), so it breaks between words alone,
   and a single word longer than the column wraps without widening it (board 993: "Anna (eve / nings)"). */
#main table.desks td:nth-child(1){overflow-wrap:break-word}
/* The row's buttons end at the table's right edge less the cell's padding, where the people list's Admit ends in the same pane. */
#main table.desks td:last-child{text-align:right}
/* THE TWO LISTS THE AGGREGATE VIEWS PAINT. A date in the monospace face is nowrap, and a long
   unbroken token would push the last column past the pane. The card id used to be that token.
   Since board 976 it is shortened and is not .mono (see .id-quiet below), so the rule no longer
   has to break it. What remains in .mono still wraps here, which is the measurement
   tests/stats-screen.mjs makes of both tables against the pane they sit in. */
#main table.view td.mono{white-space:normal;word-break:break-all}
/* THE IDENTIFIER FOLLOWS THE NAME (board 976, item 9): 11.5px monospace, dim, one short token,
   so it stays nowrap. The whole id is the cell's title. The head is already dim; the class
   marks the column that moved. */
table.view td.id-quiet{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
table.view th.id-quiet{color:var(--dim)}
/* THE PROJECTS TABLE KEEPS OPEN IN REACH: the name has a floor, Written to takes a share and fades
   at the end (board 831), and Last asked steps aside unless the Polish row has 8px to spare.
   The pane scrolls rather than clip Open where the columns still exceed it. */
#main .projects .pane{overflow-x:auto}
/* THE NAME IS SHOWN WHOLE (board 831). Chrome lays the wider sample name, "Obsługa klienta, sklep
   internetowy", in Segoe UI Variable Text at 13.5px at 204.8px of ink. The cell pads 14px a side and
   the field pads 10px and borders 1px a side, 50px more, so the cell need is 254.8px. The floor is
   256px, that need with 1.2px of slack. The other five columns take 550.3px at that padding, and
   Written to's floor is 210px, so the three sum to 1016.3px against the 1018px pane at 1280. A longer
   name keeps the whole of itself on the field's title. The pane scrolls rather than clipping Open.
   Since board 901 the name is a nowrap span, so its min-content is the whole line and the floor
   alone does not stop it widening the pane. max-width:0 holds the minimum at the floor, as Written
   to is held: a long name fades, its title keeps the rest, and free space may still widen the column. */
#main .projects td.t-title{max-width:0;min-width:256px}
#main .projects .desk{white-space:normal}
/* A path in the mono face may break anywhere, but not the file line of Written to, which fades instead (board 831). */
#main .projects .desk .mono:not(.wt-f){white-space:normal;overflow-wrap:anywhere;min-width:0}
#main .projects .none{overflow-wrap:anywhere}
/* W3, board 831: the file's name on one line, and the folder the same. A line that runs out fades
   at the end, and neither breaks mid-word. The whole path stays on hover. The column takes about
   22 per cent and may shrink, so it never pushes Open. */
#main .projects .wt-l{display:grid;gap:1px;min-width:0}
#main .projects .desk .wt-f{display:block;white-space:nowrap;overflow:hidden;overflow-wrap:normal}
#main .projects .wt-in{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;overflow-wrap:normal}
/* WRITTEN TO KEEPS ONE LINE OF THE EMPTY FOLDER (board 831). "nie wybrano jeszcze folderu" is
   164.7px of ink. One line needs a cell of 192.7px when the cell pads 14px a side, and 180.7px when
   the cells give up 6px a side below 1160. The floor is 210px, which holds that line at both
   paddings. At 1280 in Polish, 256px of name, this 210px and the other five columns at 550.3px sum
   to 1016.3px against the 1018px pane. The column still takes 22 per cent and may shrink, and the
   shrink stops at this floor, so it does not push Open. */
#main .projects td.wt{max-width:0;width:22%;min-width:210px}
/* LAST ASKED IS SHOWN WHERE THE POLISH ROW HAS AT LEAST 8PX TO SPARE (board 831).
   Measured headless at every width from 900 to 1440, and at every pixel around the edges.
   Slack is the pane's clientWidth less the table's width at min-content. With the column
   shown, Polish reaches 8px at 995 (pane 965, table 956.3, slack 8.7) and holds it to 1099,
   the rail then stacked, and again from 1287 (pane 1025, table 1016.3, slack 8.7). At 994
   and at 1286 the slack is 7.7, so the column stays hidden below 995 and from 1100 to 1286.
   The heading and the cells share .asked, and these two rules hide both, so neither can
   remain alone. Below 1160 the cells pad 8px a side, which is what lets the six remaining
   columns fit the 838px pane at 1100. The floors stay 256 and 210. No table carries .asked since the Library's own
   (board 982, below), and the rail stands beside the page at every width since 2026-11-14, so these widths are history. */
@media not all and (min-width:995px){
  #main .projects .asked{display:none}
}
@media (min-width:1100px) and (max-width:1286px){
  #main .projects .asked{display:none}
}
#main .projects .wt .desk{align-items:center}
#main .projects .none .row2{margin-top:10px;flex-wrap:wrap}
/* THE EMPTY PROJECTS SCREEN'S MARK (ui/app.js projectsMark): the block fills the pad, the figure stands on
   .e-fifth-spot above the sentence, and the canvas lies over the whole block so the arrival comes from across it. */
#main .projects:has(>.none){display:flex;flex-direction:column;min-height:100%;box-sizing:border-box}
#main .projects>.none{flex:1 1 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 24px 64px;color:var(--dim);font-size:13px}
#main .projects>.none>*{position:relative;z-index:1}
#main .projects>.none .row2{justify-content:center;margin-top:14px}
#main .projects>.none .none-sample{gap:12px;max-width:700px}
#main .projects>.none .none-note{text-align:left;max-width:460px;flex:1 1 260px}
#main .projects>.none .none-dir{margin-top:14px}
#main .projects>.none>.e-fifth-spot{width:280px;height:280px;margin:0 auto 18px;flex:none}
#main .projects>.none>canvas.e-fifth{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  color:var(--mark);--fifth-halo:#7c3aed}
:root[data-theme=dark] #main .projects>.none>canvas.e-fifth{color:#ddd6fe;--fifth-halo:#a78bfa}
/* Studio's shortest window is 900 by 560: the figure steps down so the screen never scrolls. */
@media (max-height:640px){
  #main .projects>.none{padding:8px 24px 16px}
  #main .projects>.none>.e-fifth-spot{width:160px;height:160px;margin-bottom:8px}
  #main .projects>.none .row2,#main .projects>.none .none-dir{margin-top:8px}
}
/* THE OPENING (board 957, Claudia handover, Max decisions 30 and 31): variant A, ink #8b5cf6 over the window's
   own ground, landing in Studio's corner mark (.brand svg, 25 x 25 at 14, 6.5). Nothing of the UI shows before
   landing: #band, #chrome, #rail, #main are hidden until the window arrives. --e-launch-out is the give-way fade. */
.e-launch-veil{position:fixed;inset:0;z-index:100;width:100vw;height:100vh;background:var(--bg);display:block;
  margin:0;padding:0;overflow:hidden;transition:opacity var(--e-launch-out,.35s) ease-out}
.e-launch-veil>.e-fifth-spot{width:280px;height:280px;flex:none;position:relative;z-index:1}
.e-launch-veil>canvas.e-opening,.e-launch-veil>canvas.e-fifth{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  color:var(--mark);--fifth-halo:#7c3aed}
:root[data-theme=dark] .e-launch-veil>canvas.e-opening,:root[data-theme=dark] .e-launch-veil>canvas.e-fifth{color:#ddd6fe;--fifth-halo:#a78bfa}
.e-launch-veil.e-going{opacity:0;pointer-events:none}
@keyframes e-launch-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-height:640px){.e-launch-veil>.e-fifth-spot{width:160px;height:160px}}
body.e-launch #band,body.e-launch #chrome,body.e-launch #rail,body.e-launch #main{opacity:0;pointer-events:none}
body.e-launch-out #band,body.e-launch-out #chrome,body.e-launch-out #rail,body.e-launch-out #main{animation:e-launch-in var(--e-launch-out,.35s) var(--m-ease) both}
:root.e-still .e-launch-veil{transition:none}
@media (prefers-reduced-motion:reduce){ .e-launch-veil{transition:none} body.e-launch-out #band,body.e-launch-out #chrome,body.e-launch-out #rail,body.e-launch-out #main{animation:none} }
/* Below 1160 the pane is under 900px, stacked or beside the rail. The cells give up 6px a side,
   8px instead of 14. At 10px the six columns that remain once Last asked is hidden, the name at
   its 256px floor and Written to at its 210px floor, sum to 846.6px against the 838px pane
   beside the rail at 1100. At 8px those four columns that are not on a floor shrink by 16px
   together. The name column keeps the floor above (board 831), which is
   what holds the name whole. */
@media not all and (min-width:1160px){
  #main .projects th,#main .projects td{padding-left:8px;padding-right:8px}
}
/* THE LIBRARY TABLE IS THE PANE'S OWN WIDTH (board 982, section E). Languages and Last edited step aside until the
   box itself is 1500px, so Open never leaves the row. The older floors on td.t-title and td.wt stay for the sheet
   that still names them; this pane overrides them. */
#main .projects .lib-pane{container-type:inline-size;container-name:lib;overflow-x:hidden}
#main .projects .lib-pane table{width:100%;table-layout:auto}
#main .projects .lib-pane th,
#main .projects .lib-pane td{overflow:hidden;white-space:nowrap}
#main .projects .lib-pane th:first-child,
#main .projects .lib-pane td.t-title{min-width:0;max-width:0;width:100%;overflow:hidden}
#main .projects .lib-pane td.t-title .pn{display:block}
#main .projects .lib-pane .st-cell{display:inline-flex;align-items:center;max-width:100%}
#main .projects .lib-pane .st-cell > span{align-self:baseline;overflow:hidden}
#main .projects .lib-pane .st-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-right:8px;background:var(--state-ok)}
#main .projects .lib-pane .st-dot.look{background:var(--state-look)}
#main .projects .lib-pane th.lib-acts,
#main .projects .lib-pane td.lib-acts{width:1%;white-space:nowrap;text-align:right}
#main .projects .lib-pane .col-lang,
#main .projects .lib-pane .col-edited{display:none}
@container lib (min-width: 1500px){
  #main .projects .lib-pane .col-lang,
  #main .projects .lib-pane .col-edited{display:table-cell}
}
.lib-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.lib-filters{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.lib-filters a{display:inline-flex;align-items:center;gap:6px;width:auto;padding:4px 10px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;white-space:nowrap}
.lib-filters a .num{color:var(--dim);font:500 12px var(--mono)}
.lib-filters a.on{font-weight:600;border-color:var(--line-strong)}
.lib-bar-acts{display:flex;flex-wrap:wrap;gap:8px}
.lw-gap{margin-top:16px}
.lw-recent{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
/* recentFit (app.js) counts the columns: the dashed card is the last of them, or a one-line strip across the row under the cards. */
.lw-recent.fit{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.lw-recent.under > button.lw-rc.more{grid-column:1/-1;min-height:0;padding:9px 14px}
button.lw-rc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-height:92px;
  height:auto;padding:12px 14px;text-align:left;white-space:normal;font:inherit;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
button.lw-rc b{font:600 14px var(--sans)}
button.lw-rc span{color:var(--dim);font:400 12.5px var(--sans)}
button.lw-rc.more{background:transparent;border-style:dashed;box-shadow:none}
button.lw-rc.more b{color:var(--mark);white-space:nowrap}
.lw-lang{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;
  font:600 11px var(--sans);letter-spacing:.3px;color:var(--dim)}

/* THE THIRD STATE A LINT CAN REPORT, and it invents no colour. Board 544, Maxim 2026-09-19, over
   Claudia's four sheets of 2026-09-18. The canvas has exactly two colours - the band's violet and
   the desk's cobalt - and it tells Error from Warning by weight and ground rather than by hue, so
   a third severity told apart by hue would be the first colour decision on this screen. It is
   told apart by EDGE instead: a dashed border, which is already this program's word for "nothing
   here yet" in .dashed above. Dashed reads as unfinished at 11.5px in both themes and survives a
   greyscale print, which a colour would not. */
.chip.await{background:transparent;border-style:dashed;font-weight:600;color:var(--dim)}
.pane>h3.t .chip.await{margin-left:10px;vertical-align:2px}
/* THE ROW'S MARK IS A RULE DOWN ITS LEFT EDGE AND COSTS THE TABLE NO WIDTH, which is why it beat
   the four placements that put a chip in a cell: 15 rows to the fold against 13, and 0px of
   Polish table overflow against 15 (Claudia, 1600x1000, 2026-09-18). The engine's own row band is
   a solid bar in the band colour; this is that gesture said in the unfinished voice. */
#main tr.await td:first-child,#main tr.unread td:first-child{position:relative}
#main tr.await td:first-child::before,#main tr.unread td:first-child::before{content:"";position:absolute;left:0;top:5px;bottom:5px;
  border-left:2px dashed var(--line-strong)}
/* THE STRIP ABOVE THE CARDS TABLE, which is on the screen only while something is awaiting. It
   is inside .pad and above the pane rather than in the chrome row, because a control in the
   chrome row would be there at nought as well, and this build's own comment on Duplicate and
   Delete says what that teaches. Its ground is a hair off the canvas so the dashed frame reads
   as a surface rather than as an outline somebody drew on the page. */
.strip{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-strong);
  border-radius:var(--radius-sm);padding:9px 14px;margin:0 0 12px;font:13px var(--sans);
  color:var(--dim);background:#fbfcfd}
:root[data-theme=dark] .strip{background:#15171c}
.strip .btn{flex:0 0 auto}

/* THE STATISTICS SECTION'S OWN STRIP (board 560), which carries a span in two date fields where
   the cards screen's carries a sentence, and needs three rules for it. A flex item shrinks below
   its content by default, and the label came out as three lines of one word each; input.field is
   width:100%, which is what a cover's grid wants and what makes a ten-character date 290px wide
   in a row; and a window too narrow for the line puts the button on a second one rather than
   tearing a label into a column. */
.strip.ask{flex-wrap:wrap;row-gap:8px}
.strip.ask>span{white-space:nowrap}
.strip.ask input.field{width:104px;flex:0 0 auto}

/* A FIELD WITH A FIXED SUFFIX (board 18): the .ec after a file name's stem, as the strip above keeps a
   span beside its date fields. The two .mono rules that let a path wrap (the cover's and Settings') would
   break the suffix, so it is nowrap here, and the field takes what the row has left. */
.fname{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
.fname input.field{width:auto;flex:1 1 0;min-width:0}
#dlg .kv .fname span.mono,.lsw .fname span.mono{white-space:nowrap;overflow-wrap:normal;flex:0 0 auto}

/* THE REVIEW QUEUE'S SHAPES (board 539: the queue frame E). Every one of them is a shape the canvas
   already draws somewhere else, given a name here because the queue is the screen the canvas never
   drew: .facts is the publish cover's .kv laid side by side, .after is the cards screen's .strip with
   a solid ground instead of a dashed one, and the stacked change is two lines of the same table cell.
   Nothing below invents a colour or a radius. Its two doors went with board 1016 item 7. */

/* The head pane: four facts about the file, read left to right. They wrap rather than shrink,
   because the second of them is a date and the third a catalog id, and a cut id is a lie. */
.facts{display:flex;flex-wrap:wrap;gap:0 40px;padding:0 14px}
.facts .kv{border-top:0;min-width:0}
.facts .kv .v{white-space:nowrap}

/* A line said over a screen on a solid ground, with its one press at the other end of the bar. */
.after{display:flex;align-items:center;gap:12px;border-radius:var(--radius-sm);
  padding:11px 14px;margin:0 0 14px;font-size:13.5px;background:var(--quiet)}
.after .spacer{flex:1 1 auto}
.after .lnk{font-size:13.5px;text-decoration:underline;cursor:default}

/* A CHANGE READ DOWN RATHER THAN ACROSS (frame E). A card body cut at eighty characters in a
   table column hides the clause at its end, which is the clause that changed; at the pane's
   full width it reads. The two marks are a minus and a plus in the mono face, which is what
   src/diff.mjs's own output uses and what anybody who has seen a patch already knows. */
.stack{display:grid;grid-template-columns:14px 1fr;gap:2px 8px;align-items:baseline}
.stack i{font:12.5px var(--mono);color:var(--dim);font-style:normal;text-align:center}
.stack span,.stack .also{font-size:13.5px;overflow-wrap:anywhere}
.stack span.miss{color:var(--miss)}
.stack .also em{font-style:normal;color:var(--dim)}
/* ---- THE MARKER PEN, VARIANT F: A DRAWN STROKE UNDER THE REWORDED WORDS. ----
   Maxim ruled F on 2026-09-21 12:26, over Claudia's own recommendation of A, and her objection
   stands on the record: a drawn stroke is the only hand-made texture in either program. This
   block is the ruling, and the shipped A it replaces is one commit back.

   ONE SVG OVER THE WHOLE INLINE BOX, SLICED BY THE LINE BREAKS. box-decoration-break is `slice`
   by default, so a run that wraps gets ONE drawing continued across the lines rather than one
   stamped per line, and the wobble never repeats: measured on Claudia's frame, a wrapped run's
   two fragments were 405px and 247px of one 652px drawing. A text-decoration cannot do this at
   all, and as a background the stroke also passes UNDER a Polish ogonek rather than through it,
   so the offset A had to tune does not arise.

   THE INK IS --mark's VALUE SPELLED AGAIN, once per theme, because a data URI cannot read a
   custom property: there is no construction in CSS that makes these one. The two hexes and the
   two --mark declarations are one colour and move together.

   REVERTED IS THE SAME DRAWING GONE DASHED, this family's word for nothing of ours here: the
   passage keeps its mark, so the body never loses its history. The four URLs are two custom
   properties so that the cascade stays two rules: --swash and --swash-off are re-set for dark,
   and .mk.off outranks .mk in either theme because it names one more class. */
.mk{
  --swash:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 9' preserveAspectRatio='none'>\
<path d='M2 6.2 C 40 3.4, 78 7.6, 116 5.0 S 190 3.0, 226 6.4 S 282 4.2, 298 5.6' \
fill='none' stroke='%235729a6' stroke-width='2.6' stroke-linecap='round'/></svg>");
  --swash-off:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 9' preserveAspectRatio='none'>\
<path d='M2 6.2 C 40 3.4, 78 7.6, 116 5.0 S 190 3.0, 226 6.4 S 282 4.2, 298 5.6' \
fill='none' stroke='%235729a6' stroke-width='2.6' stroke-linecap='round' \
stroke-dasharray='7 5'/></svg>");
  background-image:var(--swash);background-repeat:no-repeat;background-size:100% 9px;
  background-position:left calc(100% - 1px);padding-bottom:5px;border-radius:2px}
:root[data-theme=dark] .mk{
  --swash:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 9' preserveAspectRatio='none'>\
<path d='M2 6.2 C 40 3.4, 78 7.6, 116 5.0 S 190 3.0, 226 6.4 S 282 4.2, 298 5.6' \
fill='none' stroke='%23a78bfa' stroke-width='2.6' stroke-linecap='round'/></svg>");
  --swash-off:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 9' preserveAspectRatio='none'>\
<path d='M2 6.2 C 40 3.4, 78 7.6, 116 5.0 S 190 3.0, 226 6.4 S 282 4.2, 298 5.6' \
fill='none' stroke='%23a78bfa' stroke-width='2.6' stroke-linecap='round' \
stroke-dasharray='7 5'/></svg>")}
.mk:hover{background-color:color-mix(in srgb,var(--mark) 10%,transparent)}
/* THE RING IS DRAWN AS WELL AS THE PANEL, and that is Claudia's answer rather than a habit: a
   person tabbing has to see where they are at the moment the tooltip is up. */
.mk:focus-visible{outline:2px solid var(--mark);outline-offset:2px;
  background-color:color-mix(in srgb,var(--mark) 12%,transparent)}
.mk.off{background-image:var(--swash-off);color:var(--dim)}
.mkn{color:var(--mark)}

/* ---- THE PANEL A MARK RAISES, AND WHY IT IS A FIXED LAYER. ----
   The shape Maxim named on 2026-09-21: a filled rounded panel with a pointer at its foot,
   floating over the words, not an inline strip beneath them. The fill is the program's own
   --solid rather than a blue of its own; the colour is one line to change.

   IT CANNOT BE THE DOM NODE AFTER ITS MARK, which is where the free tab order would have come
   from. Claudia measured it: a panel positioned inside the body's own scroller grew the
   scroller's scrollHeight by 3px and landed 3px past its edge, where overflow:auto clips it, so
   on a long proposal a mark near the bottom loses half its panel. It is one fixed element
   outside #main, placed from the mark's last client rect - the END of the run, so the marked
   passage stays readable above it - and ui/app.js puts the tab order back by hand.

   z-index 4 IS THE CORNER'S, deliberately: over .work at 2 and under .scrim at 5, so a cover
   dims and swallows this the way it swallows the discs. */
.mktip{position:fixed;z-index:4;width:300px;max-width:calc(100vw - 24px);
  background:var(--solid);color:#fff;border-radius:10px;padding:11px 13px;
  box-shadow:0 10px 26px rgba(15,23,42,.30);
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  font-size:13px;line-height:1.45}
.mktip .k{font:600 10.5px var(--sans);letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.66)}
.mktip .was{overflow-wrap:anywhere}
/* The pointer is a child element and one axis only, as the engine's bubble family does it: the
   side class pins the other axis to the edge, so a panel clamped against the window still
   points AT the run rather than out of its own corner. */
.mktip i{position:absolute;width:12px;height:12px;background:var(--solid);
  transform:rotate(45deg);border-radius:3px 0 0 0}
.mktip[data-side=below] i{top:-6px}
.mktip[data-side=above] i{bottom:-6px;border-radius:0 0 3px 0}
.mktip[data-side=none] i{display:none}
.mkput{height:26px;padding:0 10px;border:1px solid rgba(255,255,255,.34);
  border-radius:var(--radius-xs);background:rgba(255,255,255,.12);color:#fff;
  font:500 12.5px var(--sans);display:inline-flex;align-items:center;gap:7px}
.mkput:hover,.mkput:focus-visible{background:rgba(255,255,255,.22)}
.mkput .key{font:11px var(--mono);border:1px solid rgba(255,255,255,.34);border-radius:4px;
  padding:0 5px;color:rgba(255,255,255,.82)}

/* EVERY MARK IS ALSO A ROW, which is Claudia's answer to a desk with no hover at all and is
   why nothing second had to be built for touch: tapping a mark is focusing it. The row is what
   a screen reader gets, what a printed proposal gets, and what somebody with eleven marks in a
   long body gets without hunting for small runs with a pointer. The words rather than the
   .stack's minus and plus, because here the two sides are named and not diffed. */
.mkl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.mkl i{font:600 10.5px var(--sans);letter-spacing:.7px;text-transform:uppercase;color:#9aa4b2;
  font-style:normal;white-space:nowrap}
.mkl span{font-size:13.5px;overflow-wrap:anywhere}
.mkl span.old{color:var(--dim)}
.rvwhat{display:grid;gap:3px;min-width:0}
.rvwhat b{font-weight:600}

/* THE AUDIT PACK'S FIVE COUNTS (board 606). Claudia drew them as one panel divided into
   five equal cells with the number above its label, and the canvas has neither: .facts is a
   WRAPPING row, which puts the fifth count alone on a second line in a 1299px window, and
   .kv .v is 14px. So the five are a grid that keeps them equal and lets them fold in pairs
   rather than four and one, and the number takes the only size on this screen the canvas
   does not already have. Everything else about a tile is .kv, hers, in her order reversed
   so that the number is read before its label as it is in her frames. */
.tiles{display:grid;gap:4px 24px;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));
  padding:0 14px}
.tiles .kv{border-top:0;min-width:0}
.tiles .kv .v{font-size:24px;line-height:1.15}

/* THE STATISTICS, READ THREE WAYS (board 862), Claudia beta's sheet of 2026-10-06: one head for the three, the way of
   reading it as the sheet's .seg, whose chosen face travels (.st-pill) when the view changes. No colour is new: the
   violet is --mark, the cobalt is --engine and is only on what is a desk's, every neutral is the sheet's. */
.st-head{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.st-head h1{margin:0;flex:0 0 auto}
